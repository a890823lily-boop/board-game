<style>
/* Layout: phone-style rules app — sticky title bar, one topic per screen, fixed bottom tab bar; same poster look as the other 水瓶座 pages (deliberately light-only, every colour explicit) */
:root {

/* steps */
.steps { display: grid; gap: 12px; counter-reset: s; }

/* connect rules */

.ex { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 12px; }

/* try it */
.status { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.pillc { font-family: var(--f-head); font-weight: 900; font-size: 18px; border-radius: 999px; padding: 6px 14px; background: var(--card); color: var(--blue); }
.meter { display: flex; gap: 5px; }

.slot { position: absolute; border: 3px dashed #8FB4E3; border-radius: 9%/7%; background: rgba(255,255,255,.4); cursor: pointer; padding: 0; }

.slot:disabled { opacity: .3; cursor: default; }

.hcard { border: 0; background: none; padding: 0; cursor: pointer; border-radius: 10px; }

.ctl { display: flex; gap: 10px; flex-wrap: wrap; }
.btn { font-family: var(--f-head); font-weight: 900; font-size: 20px; cursor: pointer; color: #fff; background: var(--blue); border: 0; border-radius: 999px; padding: 8px 22px 10px; box-shadow: 0 4px 0 var(--blue-deep); }
.btn.ghost { background: var(--card); color: var(--blue); border: 2px solid #BCD0EC; box-shadow: 0 4px 0 #BCD0EC; }
.btn:disabled { opacity: .35; cursor: default; }
.msg { border-radius: 16px; padding: 12px 16px; font-size: clamp(20px, 3.2vw, 24px); font-weight: 700; }
.msg.ok { background: var(--good-soft); color: var(--good); }
.msg.no { background: var(--bad-soft); color: var(--bad); }

<script>
const zh = text => `<span class="zt">${text}</span>`;
const SPEAKER = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19.3 5.7a9 9 0 0 1 0 12.6"/></svg>';
function say(text) {
  try {
    const s = window.speechSynthesis; if (!s) return;
    s.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/[「」＿]/g, ''));
    u.lang = 'zh-TW'; u.rate = 0.85;
    const v = s.getVoices().find(v => /zh[-_]TW/i.test(v.lang)) || s.getVoices().find(v => /^zh/i.test(v.lang));
    if (v) u.voice = v;
    s.speak(u);
  } catch (e) {}
}
const sp = text => `<button class="speak" type="button" data-say="${text}">${SPEAKER}${zh('聽')}</button>`;

/* ---------- elements & cards ---------- */
const EL = {
  s: { name: '天空', bg: '#5BB8F0', icon: '<path d="M5 31 A15 15 0 0 1 35 31" stroke="#E2453C" stroke-width="3.2" fill="none"/><path d="M8.6 31 A11.4 11.4 0 0 1 31.4 31" stroke="#F4C430" stroke-width="3.2" fill="none"/><path d="M12.2 31 A7.8 7.8 0 0 1 27.8 31" stroke="#3FAE4A" stroke-width="3.2" fill="none"/><g fill="#fff"><circle cx="12" cy="30" r="5"/><circle cx="19" cy="27" r="6.5"/><circle cx="26" cy="30" r="5"/><rect x="12" y="29" width="14" height="6"/></g>' },
  w: { name: '水', bg: '#14A3A0', icon: '<g fill="#fff" opacity=".85"><circle cx="9" cy="9" r="1.8"/><circle cx="31" cy="12" r="1.5"/><circle cx="28" cy="31" r="1.8"/></g><ellipse cx="18" cy="21" rx="9" ry="5.5" fill="#E8327A"/><path d="M26 21 L34 15 L34 27 Z" fill="#E8327A"/><circle cx="14" cy="20" r="1.4" fill="#fff"/>' },
  g: { name: '草地', bg: '#7BC043', icon: '<path d="M0 30 Q20 22 40 30 L40 40 L0 40 Z" fill="#4E9A2B"/><g fill="#EC4FA0"><circle cx="20" cy="13" r="4.4"/><circle cx="26.5" cy="18" r="4.4"/><circle cx="24" cy="25.5" r="4.4"/><circle cx="16" cy="25.5" r="4.4"/><circle cx="13.5" cy="18" r="4.4"/></g><circle cx="20" cy="19.5" r="3.6" fill="#F7D25A"/>' },
  f: { name: '火焰', bg: '#F2711C', icon: '<path d="M20 4 C24 12 32 16 30 26 C29 33 24 37 20 37 C14 37 9 32 10 25 C11 19 15 17 15 11 C18 14 18 17 18 19 C21 15 21 9 20 4 Z" fill="#FFD23F"/><path d="M20 20 C23 24 25 27 24 31 C23 34 21 35 20 35 C17 35 15 32 16 29 C17 26 19 25 20 20 Z" fill="#FFF3B0"/>' },
  p: { name: '太空', bg: '#6B36B0', icon: '<path d="M20 7 l3.6 7.6 8.3 1 -6.1 5.7 1.6 8.2 -7.4-4.1 -7.4 4.1 1.6-8.2 -6.1-5.7 8.3-1z" fill="#fff"/><g fill="#fff"><circle cx="7" cy="8" r="1.4"/><circle cx="33" cy="33" r="1.6"/><circle cx="8" cy="32" r="1.1"/><circle cx="34" cy="7" r="1.1"/></g>' },
};
const ORDER = ['s', 'w', 'g', 'f', 'p'];
const icon = (k, px) => `<svg viewBox="0 0 40 40" ${px ? `width="${px}" height="${px}"` : ''} aria-hidden="true">${EL[k].icon}</svg>`;
const sec = (k, px) => `<div class="s" style="background:${EL[k].bg}">${icon(k, px)}</div>`;
const turn = cs => [cs[3], cs[2], cs[1], cs[0]];   // half a turn: still upright, upside down
const cardName = cs => [...new Set(cs)].map(k => EL[k].name).join('、');
function ecard(cs, w, style = '', cls = '') {
  const [a, b, c, d] = cs;
  let inner;
  if (a === b && b === c && c === d) inner = `<div class="in">${sec(a, w * .52)}</div>`;
  else if (a === b && c === d) inner = `<div class="in" style="grid-template-rows:1fr 1fr">${sec(a, w * .38)}${sec(c, w * .38)}</div>`;
  else if (a === c && b === d) inner = `<div class="in" style="grid-template-columns:1fr 1fr">${sec(a, w * .34)}${sec(b, w * .34)}</div>`;
  else inner = `<div class="in" style="grid-template:1fr 1fr/1fr 1fr">${cs.map(k => sec(k, w * .3)).join('')}</div>`;
  return `<div class="ecard ${cls}" role="img" aria-label="元素牌：${cardName(cs)}" style="width:${w}px;height:${w * 4 / 3}px;${style}">${inner}</div>`;
}
const goalCard = k => `<span class="gcard" role="img" aria-label="任務牌：${EL[k].name}"><span style="background:${EL[k].bg}">${icon(k, 32)}</span></span>`;
const wildCard = () => `<span class="wild" role="img" aria-label="萬用牌"><div><b>WILD</b></div></span>`;
const X = '<svg class="mark" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="#C2452F"/><path d="M13 13 L27 27 M27 13 L13 27" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/></svg>';
const V = '<svg class="mark" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="#2E8B4E"/><path d="M11 21 L18 27 L29 14" stroke="#fff" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';

/* ---------- board logic ---------- */
const key = (x, y) => x + ',' + y;
const DIRS = [[1, 0, [1, 3], [0, 2]], [-1, 0, [0, 2], [1, 3]], [0, 1, [2, 3], [0, 1]], [0, -1, [0, 1], [2, 3]]];
function neighbours(map, x, y) {
  const out = [];
  for (const [dx, dy, mine, theirs] of DIRS) { const n = map.get(key(x + dx, y + dy)); if (n) out.push({ n, mine, theirs }); }
  return out;
}
function legal(map, x, y, cs) {
  if (map.has(key(x, y))) return false;
  const ns = neighbours(map, x, y);
  if (!ns.length) return false;
  return ns.every(({ n, mine, theirs }) => cs[mine[0]] === n.cs[theirs[0]] || cs[mine[1]] === n.cs[theirs[1]]);
}
function group(map, el) {
  const cards = [...map.values()].filter(c => c.cs.includes(el));
  const seen = new Set(); let best = [];
  for (const c of cards) {
    if (seen.has(c)) continue;
    const comp = [c]; seen.add(c);
    for (let i = 0; i < comp.length; i++) {
      const cur = comp[i];
      for (const { n, mine, theirs } of neighbours(map, cur.x, cur.y)) {
        if (seen.has(n)) continue;
        if ((cur.cs[mine[0]] === el && n.cs[theirs[0]] === el) || (cur.cs[mine[1]] === el && n.cs[theirs[1]] === el)) { seen.add(n); comp.push(n); }
      }
    }
    if (comp.length > best.length) best = comp;
  }
  return best;
}
const toMap = cards => new Map(cards.map(([x, y, cs]) => [key(x, y), { x, y, cs }]));
function slotsOf(map) {
  const s = new Map();
  for (const c of map.values()) for (const [dx, dy] of DIRS) { const k = key(c.x + dx, c.y + dy); if (!map.has(k)) s.set(k, { x: c.x + dx, y: c.y + dy }); }
  return [...s.values()];
}
function drawBoard(el, map, opts = {}) {
  const slots = opts.slots ? slotsOf(map) : [];
  const all = [...map.values(), ...slots];
  const xs = all.map(c => c.x), ys = all.map(c => c.y);
  const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
  const cols = maxX - minX + 1, rows = maxY - minY + 1;
  const avail = Math.max(220, el.parentElement.clientWidth - 8);
  const w = Math.max(30, Math.min(opts.max || 84, Math.floor(avail / cols)));
  const h = w * 4 / 3;
  el.style.width = cols * w + 'px'; el.style.height = rows * h + 'px';
  const pos = (x, y) => `left:${(x - minX) * w}px;top:${(y - minY) * h}px;`;
  let html = '';
  for (const c of map.values()) html += ecard(c.cs, w, pos(c.x, c.y), (opts.cls && opts.cls(c)) || '');
  for (const s of slots) html += `<button class="slot" type="button" data-x="${s.x}" data-y="${s.y}" aria-label="放在這裡" style="${pos(s.x, s.y)}width:${w}px;height:${h}px"></button>`;
  el.innerHTML = html;
}

/* ---------- try it: a solo practice game ---------- */
const GOAL = 'f';
const POOL = (() => {
  const out = [];
  for (const a of ORDER) { out.push([a, a, a, a]); for (const b of ORDER) if (a !== b) { out.push([a, a, b, b]); out.push([a, b, a, b]); } }
  for (let i = 0; i < 12; i++) { const r = () => ORDER[Math.floor(Math.random() * 5)]; out.push([r(), r(), r(), r()]); }
  return out;
})();
const rnd = () => POOL[Math.floor(Math.random() * POOL.length)];
let game;
function newGame() {
  game = { map: toMap([[0, 0, ['s','w','g','f']]]), hand: [rnd(), rnd(), rnd()], phase: 'draw', sel: null, last: null, msg: { k: 'info', t: '① 先按「抽一張牌」。' }, turns: 0 };
}
newGame();
function pTry() {
  const n = group(game.map, GOAL).length;
  const won = n >= 7;
  const hand = game.hand.map((cs, i) => `<button class="hcard" type="button" data-h="${i}" aria-pressed="${game.sel === i}" aria-label="手牌：${cardName(cs)}" ${game.phase !== 'play' || won ? 'disabled' : ''}>${ecard(cs, 70)}</button>`).join('');
  return `
  <section class="sec">
    <h2>${zh('試玩：接接看')} ${sp('你的任務是火焰。先抽一張牌，再出一張牌，把火焰連成七張！')}</h2>
    <div class="goalline">${goalCard(GOAL)}<div class="tx">${zh('你的任務是火焰。把火焰連成七張！')}</div></div>
    <div class="felt">
      <div class="status">
        <span class="pillc">${zh(`火焰連了：${'零一二三四五六七八九十'[Math.min(n, 10)]}張`)}</span>
        <span class="meter" aria-hidden="true">${[...Array(7)].map((_, i) => `<i class="${i < n ? 'on' : ''}"></i>`).join('')}</span>
      </div>
      <div><div class="board" id="tryBoard"></div></div>
      <div class="hand">${hand}</div>
      <div class="ctl">
        <button class="btn" type="button" id="draw" ${game.phase !== 'draw' || won ? 'disabled' : ''}>${zh('抽一張牌')}</button>
        <button class="btn ghost" type="button" id="turn" ${game.sel === null || won ? 'disabled' : ''}>${zh('轉半圈')}</button>
        <button class="btn ghost" type="button" id="skip" ${game.phase !== 'play' || won ? 'disabled' : ''}>${zh('跳過')}</button>
        <button class="btn ghost" type="button" id="restart">${zh('重新開始')}</button>
      </div>
    </div>
    ${won ? `<div class="msg win pop">${zh(`你贏了！用了${game.turns}回合把火焰連成七張！`)}</div>` : `<div class="msg ${game.msg.k} ${game.last ? 'pop' : ''}" role="status">${zh(game.msg.t)}</div>`}
    <p class="note">${zh('提醒：看任務、找元素、碰一起。選好一張牌後，可以按「轉半圈」換方向。手牌沒有火焰時，可以按「跳過」。')}</p>
  </section>`;
}
function mountTry() {
  const g = group(game.map, GOAL);
  const won = g.length >= 7;
  drawBoard(document.getElementById('tryBoard'), game.map, { slots: game.phase === 'play' && !won, max: 78,
    cls: c => (game.last && c.x === game.last.x && c.y === game.last.y ? 'new' : (g.includes(c) && g.length > 1 ? 'lit' : '')) });
  main.querySelectorAll('.slot').forEach(b => { b.disabled = game.sel === null; b.onclick = () => place(+b.dataset.x, +b.dataset.y); });
  main.querySelectorAll('[data-h]').forEach(b => b.onclick = () => { game.sel = game.sel === +b.dataset.h ? null : +b.dataset.h; game.last = null; game.msg = { k: 'info', t: game.sel === null ? '② 點一張手牌。' : '③ 點桌上的虛線格子，把牌放上去。接不上的話，可以按「轉半圈」。' }; render(); });
  document.getElementById('draw').onclick = () => { if (game.hand.length >= 6) game.hand.shift(); game.hand.push(rnd()); game.phase = 'play'; game.sel = null; game.last = null; game.msg = { k: 'info', t: '② 看看可以放哪裡，點一張手牌。' }; say('看看可以放哪裡'); render(); };
  document.getElementById('skip').onclick = () => { game.phase = 'draw'; game.sel = null; game.last = null; game.turns++; game.msg = { k: 'info', t: '跳過了。下一回合，再抽一張牌。' }; render(); };
  document.getElementById('turn').onclick = () => { if (game.sel === null) return; game.hand[game.sel] = turn(game.hand[game.sel]); game.last = null; game.msg = { k: 'info', t: '轉好了！再點桌上的虛線格子。' }; render(); };
  document.getElementById('restart').onclick = () => { newGame(); render(); };
}
function place(x, y) {
  const cs = game.hand[game.sel];
  if (!legal(game.map, x, y, cs)) {
    game.msg = { k: 'no', t: '接不上喔！碰到的地方，要有相同的元素。也可以按「轉半圈」再試試。' }; game.last = null;
    say('接不上喔！碰到的地方，要有相同的元素。'); render(); return;
  }
  const before = group(game.map, GOAL).length;
  game.map.set(key(x, y), { x, y, cs });
  game.hand.splice(game.sel, 1);
  game.sel = null; game.phase = 'draw'; game.turns++; game.last = { x, y };
  const after = group(game.map, GOAL).length;
  if (after >= 7) { say('你贏了！'); }
  else if (after > before) { game.msg = { k: 'ok', t: `好棒！火焰連成${'零一二三四五六七'[after]}張了。再抽一張牌吧！` }; say(`好棒！火焰連成${'零一二三四五六七'[after]}張了`); }
  else { game.msg = { k: 'info', t: '接上了！可是火焰沒有變多。想一想：你的火焰有碰在一起嗎？' }; say('接上了，可是火焰沒有變多'); }
  render();
}

const tabs = document.getElementById('tabs');
function render() {
  tabs.innerHTML = PAGES.map((p, i) => `<button class="tab" type="button" data-tab="${i}" ${i === cur ? 'aria-current="page"' : ''}><svg viewBox="0 0 24 24" aria-hidden="true">${TAB_ICONS[p.id]}</svg><span class="l">${zh(p.label)}</span></button>`).join('');
  tabs.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => go(+b.dataset.tab));
  main.innerHTML = `<div style="display:grid;gap:18px">${PAGES[cur].render()}</div>`;
  main.querySelectorAll('[data-say]').forEach(b => b.onclick = () => say(b.dataset.say));
  main.querySelectorAll('[data-go]').forEach(b => b.onclick = () => go(PAGES.findIndex(p => p.id === b.dataset.go)));
  const id = PAGES[cur].id;
  if (id === 'play') { const m = toMap(WIN), g = group(m, 'f'); drawBoard(document.getElementById('winBoard'), m, { max: 64, cls: c => g.includes(c) ? 'lit' : '' }); }
  if (id === 'try') mountTry();
}
function go(i) {
  if (i < 0) return;
  const y = cur === i ? window.scrollY : 0;
  cur = i;
  if (location.hash !== '#' + PAGES[cur].id) history.replaceState(null, '', '#' + PAGES[cur].id);
  render(); window.scrollTo(0, y);
}
window.addEventListener('hashchange', () => { const i = PAGES.findIndex(p => '#' + p.id === location.hash); if (i >= 0 && i !== cur) go(i); });
let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { if (['play', 'try'].includes(PAGES[cur].id)) { const y = window.scrollY; render(); window.scrollTo(0, y); } }, 150); });
document.querySelectorAll('[data-zh]').forEach(el => el.innerHTML = zh(el.dataset.zh));
const start = PAGES.findIndex(p => '#' + p.id === location.hash);
cur = start >= 0 ? start : 0;
render();
</script>

/* Layout: one centred column — video card, then a quiz "game table" card; single warm classroom look (deliberately light-only, every colour explicit) */
:root {
  color-scheme: light;
  --paper: #FFF8EA;      /* classroom poster cream */
  --card: #FFFFFF;
  --ink: #3B322C;
  --muted: #7C6F64;
  --blue: #2D5FA8;       /* title blue from the slides */
  --blue-soft: #E6EFFB;
  --red: #D93A2B;        /* explanation red from the slides */
  --felt: #E5EFE2;       /* game table */
  --felt-line: #C6DBC1;
  --good: #2E8B4E;
  --good-soft: #E1F3E6;
  --bad: #C2452F;
  --bad-soft: #FBE6E1;
  --sun: #F7C948;
  --f-kid: "LXGW WenKai TC", "Kaiti TC", "DFKai-SB", "BiauKai", "Noto Sans TC", serif;
  --f-head: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
}
* { box-sizing: border-box; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--f-kid);
  font-size: 18px;
  padding-inline: 16px;
  padding-block: 0 48px;
}
.wrap { max-width: 860px; margin: 0 auto; display: grid; gap: 28px; }

/* ---------- zhuyin ---------- */
.z { display: inline-flex; align-items: center; vertical-align: middle; margin-right: .08em; }
.z .h { line-height: 1.15; }
.z .b { display: inline-grid; grid-template-columns: auto .42em; align-items: center; font-size: .42em; line-height: 1; margin-left: .1em; font-weight: 400; }
.z .b i { grid-column: 1; font-style: normal; display: block; text-align: center; height: .9em; line-height: .9em; }
.z .b i.nt { height: .6em; line-height: .3em; }
.z .t { grid-column: 2; align-self: start; font-size: .8em; line-height: 1; transform: translateY(-.25em); }
.p { display: inline-block; }
.zt { display: inline; line-height: 1.75; }

/* ---------- header ---------- */
header {
  padding-block: 28px 4px;
  display: grid; gap: 6px; justify-items: center; text-align: center;
  position: relative;
}
header h1 {
  margin: 0; font-family: var(--f-head); font-weight: 900; color: var(--blue);
  font-size: clamp(34px, 7vw, 56px); letter-spacing: .02em; text-wrap: balance;
}
header h1 .z .sy, header h1 .z .t { font-family: var(--f-head); font-weight: 700; }
header p { margin: 0; color: var(--muted); font-size: clamp(17px, 3.4vw, 22px); }
.flower { position: absolute; top: 20px; width: 64px; height: 64px; }
.flower.l { left: 0; } .flower.r { right: 0; }
@media (max-width: 560px) { .flower { width: 40px; height: 40px; top: 8px; } }

/* ---------- section cards ---------- */
section.panel {
  background: var(--card);
  border-radius: 28px;
  border: 3px solid #EFE4CF;
  padding: clamp(16px, 3.5vw, 30px);
  display: grid; gap: 16px;
}
.tag {
  justify-self: start;
  font-family: var(--f-head); font-weight: 700; color: #fff; background: var(--blue);
  border-radius: 999px; padding: 4px 18px 6px; font-size: 22px;
}
.tag .z .sy, .tag .z .t { font-family: var(--f-head); }
video { width: 100%; max-width: 100%; border-radius: 16px; background: #000; display: block; aspect-ratio: 16 / 9; }
.hint { color: var(--muted); font-size: 17px; margin: 0; }

/* ---------- quiz ---------- */
.qtop { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.dots { display: flex; gap: 7px; flex-wrap: wrap; }
.dot { width: 16px; height: 16px; border-radius: 50%; background: #EDE6DA; border: 2px solid #E0D6C6; }
.dot.now { background: var(--sun); border-color: #E3AE1B; transform: scale(1.2); }
.dot.ok { background: var(--good); border-color: var(--good); }
.dot.no { background: var(--bad); border-color: var(--bad); }
.qno { font-family: var(--f-head); font-weight: 900; color: var(--blue); font-size: 20px; }

.table {
  background: var(--felt);
  border: 3px solid var(--felt-line);
  border-radius: 24px;
  padding: clamp(16px, 3vw, 26px);
  display: grid; gap: 18px;
}
.qrow { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
.qimg { width: 128px; max-width: 32%; border-radius: 12px; box-shadow: 0 6px 14px rgba(40, 50, 30, .25); transform: rotate(-3deg); }
.qtext { flex: 1 1 260px; min-width: 0; font-size: clamp(25px, 4.6vw, 34px); font-weight: 700; color: var(--ink); }
.speak {
  display: inline-flex; align-items: center; gap: 8px;
  font: inherit; font-size: 18px; font-weight: 700; color: var(--blue);
  background: var(--card); border: 2px solid #BCD0EC; border-radius: 999px;
  padding: 6px 16px 6px 12px; cursor: pointer;
}
.speak svg { width: 22px; height: 22px; }
.speak:focus-visible, .opt:focus-visible, .btn:focus-visible { outline: 4px solid var(--sun); outline-offset: 3px; }

.opts { display: grid; gap: 12px; grid-template-columns: 1fr; }
.opts.imgs { grid-template-columns: repeat(4, minmax(0, 1fr)); }
@media (max-width: 620px) { .opts.imgs { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.opt {
  font: inherit; text-align: left; cursor: pointer; color: var(--ink);
  background: var(--card); border: 3px solid #DCD2C0; border-radius: 18px;
  padding: 12px 18px; font-size: clamp(22px, 4vw, 28px); font-weight: 700;
  display: flex; align-items: center; gap: 14px; min-width: 0;
  box-shadow: 0 4px 0 #DCD2C0;
  transition: transform .12s ease, box-shadow .12s ease;
}
.opt:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 0 #CFC3AE; }
.opt:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 2px 0 #CFC3AE; }
.opt .key {
  flex: none; width: 40px; height: 40px; border-radius: 50%;
  display: grid; place-items: center; font-family: var(--f-head); font-size: 20px;
  background: var(--blue-soft); color: var(--blue);
}
.opt .lbl { min-width: 0; }
.opts.imgs .opt { flex-direction: column; padding: 12px; gap: 8px; text-align: center; }
.opts.imgs .opt img { width: 100%; max-width: 150px; border-radius: 10px; }
.opt:disabled { cursor: default; }
.opt.right { border-color: var(--good); background: var(--good-soft); box-shadow: 0 4px 0 var(--good); }
.opt.right .key { background: var(--good); color: #fff; }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); box-shadow: 0 4px 0 var(--bad); }
.opt.wrong .key { background: var(--bad); color: #fff; }
.opt.fade { opacity: .45; }

.feedback {
  border-radius: 18px; padding: 14px 18px; display: grid; gap: 6px;
  font-size: clamp(21px, 3.8vw, 26px); font-weight: 700;
}
.feedback.ok { background: var(--good-soft); color: var(--good); }
.feedback.no { background: var(--bad-soft); color: var(--bad); }
.feedback .ex { color: var(--ink); font-weight: 400; }
.actions { display: flex; justify-content: flex-end; gap: 12px; flex-wrap: wrap; }
.btn {
  font: inherit; font-family: var(--f-head); font-weight: 900; font-size: 24px; cursor: pointer;
  color: #fff; background: var(--blue); border: 0; border-radius: 999px; padding: 10px 30px 12px;
  box-shadow: 0 5px 0 #1D4482;
}
.btn .z .sy, .btn .z .t { font-family: var(--f-head); }
.btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #1D4482; }
.btn.ghost { background: var(--card); color: var(--blue); box-shadow: 0 5px 0 #BCD0EC; border: 2px solid #BCD0EC; }

/* result */
.result { display: grid; gap: 18px; justify-items: center; text-align: center; }
.stars { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
.stars svg { width: 44px; height: 44px; }
@media (max-width: 560px) { .stars svg { width: 30px; height: 30px; } }
.score { font-family: var(--f-head); font-weight: 900; color: var(--blue); font-size: clamp(28px, 6vw, 42px); }
.review { width: 100%; display: grid; gap: 12px; text-align: left; }
.review h3 { margin: 0; font-size: 24px; color: var(--red); }
.rv { display: flex; gap: 14px; align-items: center; background: var(--card); border-radius: 16px; padding: 10px 14px; border: 2px solid #EFE4CF; }
.rv img { width: 70px; border-radius: 8px; flex: none; }
.rv .tx { min-width: 0; display: grid; gap: 2px; font-size: 21px; }
.rv .nm { font-weight: 700; color: var(--blue); font-size: 24px; }
.teacher { color: var(--muted); font-size: 16px; font-family: var(--f-head); font-weight: 700; }

@keyframes pop { 0% { transform: scale(.6); opacity: .3 } 70% { transform: scale(1.12) } 100% { transform: scale(1); opacity: 1 } }
.pop { animation: pop .35s ease-out; }
@media (prefers-reduced-motion: reduce) { .pop { animation: none; } .opt { transition: none; } }
footer { text-align: center; color: var(--muted); font-size: 15px; font-family: var(--f-head); }
</style>

function zh(text) {
  let out = '';
  for (const ch of text) {
    const z = ZY[ch];
    if (!z || PUNCT.test(ch)) { out += `<span class="p">${ch}</span>`; continue; }
    const neutral = z.startsWith('˙');
    let sy = [...z.replace('˙', '')];
    let tone = '';
    if ('ˊˇˋ'.includes(sy.at(-1))) tone = sy.pop();
    const n = sy.length + (neutral ? 1 : 0);
    const col = (neutral ? '<i class="nt">˙</i>' : '') + sy.map(c => `<i>${c}</i>`).join('');
    out += `<span class="z"><span class="h">${ch}</span><span class="b" aria-hidden="true">${col}` +
      (tone ? `<span class="t" style="grid-row:${n}">${tone}</span>` : '') + `</span></span>`;
  }
  return `<span class="zt" aria-label="${text}">${out}</span>`;
}

  rotate_goals: { name: '大風吹',     desc: '所有玩家的任務牌，一起往同一個方向傳。' },
  shuffle:      { name: '重洗手牌',   desc: '把大家的手牌收起來，洗一洗，再發回去。' },
  move:         { name: '移動一張牌', desc: '把桌上的一張元素牌，移到另一個接得上的地方。' },
  trade_hands:  { name: '交換手牌',   desc: '你和一位玩家，交換全部的手牌。' },
  zap:          { name: '拿回元素牌', desc: '把桌上的一張元素牌，拿回自己的手上。' },
};

// a = index of the right answer in opts (before shuffling); card = which card the question checks
const QUESTIONS = [
  { card: 'trade_goals', img: 'trade_goals', q: '這張牌叫什麼名字？',
    opts: ['交換任務牌', '大風吹', '交換手牌', '重洗手牌'], a: 0, ex: '你和一位玩家，交換任務牌。' },
  { card: 'rotate_goals', q: '「所有玩家的任務牌，一起往同一個方向傳。」是哪一張牌？',
    imgs: ['rotate_goals', 'trade_goals', 'trade_hands', 'shuffle'], a: 0, ex: '這是大風吹！' },
  { card: 'zap', img: 'zap', q: '這張牌可以做什麼？',
    opts: ['把桌上的一張元素牌，拿回手上', '和一位玩家，交換全部的手牌', '把大家的手牌洗一洗，再發回去'], a: 0,
    ex: '拿回元素牌：把桌上的一張元素牌，拿回自己的手上。' },
  { card: 'trade_hands', q: '你只有一張手牌，別人有五張。用哪一張牌最好？',
    imgs: ['trade_hands', 'zap', 'move', 'rotate_goals'], a: 0, ex: '用交換手牌，換過來就賺到了！' },
  { card: 'move', img: 'move', q: '移動一張牌的時候，移過去的牌要接得上嗎？',
    opts: ['要接得上', '不用接，放哪裡都可以'], a: 0, ex: '移過去的牌，元素要一樣才接得上。' },
  { card: 'shuffle', img: 'shuffle', q: '重洗手牌的時候，要從誰開始發牌？',
    opts: ['出牌的人', '年紀最小的人', '手牌最多的人'], a: 0, ex: '從出牌的人開始，一張一張發。' },
  { card: 'move', img: 'move', q: '移動一張牌，還可以怎麼做？',
    opts: ['在原地轉半圈', '拿回自己的手上', '送給別的玩家'], a: 0, ex: '也可以在原地轉半圈，轉完也要接得上。' },
  { card: 'trade_goals', q: '想和一位玩家交換任務牌，要用哪一張牌？',
    imgs: ['trade_goals', 'zap', 'move', 'shuffle'], a: 0, ex: '用交換任務牌！' },
  { card: 'rotate_goals', img: 'rotate_goals', q: '大風吹的時候，任務牌可以往哪裡傳？',
    opts: ['往左或往右都可以', '只能往左', '只能往右'], a: 0, ex: '往左或往右都可以，大家要往同一個方向傳。' },
  { card: 'shuffle', img: 'shuffle', q: '這張牌叫什麼名字？',
    opts: ['重洗手牌', '交換手牌', '拿回元素牌', '移動一張牌'], a: 0, ex: '把大家的手牌收起來，洗一洗，再發回去。' },
];

const KEYS = ['A', 'B', 'C', 'D'];
const SPEAKER = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19.3 5.7a9 9 0 0 1 0 12.6"/></svg>';
const STAR = (on) => `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.6l2.9 6 6.5.8-4.8 4.5 1.2 6.5L12 17.3l-5.8 3.1 1.2-6.5L2.6 9.4l6.5-.8z" fill="${on ? '#F7C948' : '#EDE6DA'}" stroke="${on ? '#E3AE1B' : '#DCD2C0'}" stroke-width="1.2" stroke-linejoin="round"/></svg>`;

const box = document.getElementById('quiz');
let order, cur, results, answered, firstRun = true;

function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function start() {
  order = firstRun ? QUESTIONS.map((_, i) => i) : shuffle(QUESTIONS.map((_, i) => i));
  firstRun = false;
  results = []; cur = 0;
  render();
}

function say(text) {
  try {
    const s = window.speechSynthesis; if (!s) return;
    s.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/[「」]/g, ''));
    u.lang = 'zh-TW'; u.rate = 0.85;
    const v = s.getVoices().find(v => /zh[-_]TW/i.test(v.lang)) || s.getVoices().find(v => /^zh/i.test(v.lang));
    if (v) u.voice = v;
    s.speak(u);
  } catch (e) {}
}

function render() {
  answered = false;
  const Q = QUESTIONS[order[cur]];
  const isImg = !!Q.imgs;
  const items = (isImg ? Q.imgs : Q.opts).map((v, i) => ({ v, right: i === Q.a }));
  Q._shown = shuffle(items);
  const dots = order.map((_, i) => `<span class="dot ${i < cur ? (results[i] ? 'ok' : 'no') : i === cur ? 'now' : ''}"></span>`).join('');
  box.innerHTML = `
    <div style="display:grid;gap:16px">
      <div class="qtop">
        <div class="qno">${cur + 1} / ${order.length}</div>
        <div class="dots" aria-hidden="true">${dots}</div>
      </div>
      <div class="table">
        <div class="qrow">
          ${Q.img ? `<img class="qimg" src="${Q.img}.png" alt="${CARDS[Q.img].name}的牌">` : ''}
          <div class="qtext">${zh(Q.q)}</div>
        </div>
        <div><button class="speak" id="say" type="button">${SPEAKER}${zh('聽題目')}</button></div>
        <div class="opts ${isImg ? 'imgs' : ''}" role="group" aria-label="選項">
          ${Q._shown.map((it, i) => isImg
            ? `<button class="opt" type="button" id="opt${i}" data-i="${i}"><span class="key">${KEYS[i]}</span><img src="${it.v}.png" alt="${CARDS[it.v].name}"></button>`
            : `<button class="opt" type="button" id="opt${i}" data-i="${i}"><span class="key">${KEYS[i]}</span><span class="lbl">${zh(it.v)}</span></button>`).join('')}
        </div>
        <div id="fb"></div>
      </div>
    </div>`;
  box.querySelector('#say').onclick = () => say(Q.q + (isImg ? '' : '。' + Q._shown.map((it, i) => KEYS[i] + '，' + it.v).join('。')));
  box.querySelectorAll('.opt').forEach(b => b.onclick = () => pick(+b.dataset.i));
}

function pick(i) {
  if (answered) return; answered = true;
  const Q = QUESTIONS[order[cur]];
  const ok = Q._shown[i].right;
  results[cur] = ok;
  box.querySelectorAll('.opt').forEach((b, j) => {
    b.disabled = true;
    if (Q._shown[j].right) b.classList.add('right', 'pop');
    else if (j === i) b.classList.add('wrong');
    else b.classList.add('fade');
  });
  const rightIdx = Q._shown.findIndex(it => it.right);
  const last = cur === order.length - 1;
  const fb = box.querySelector('#fb');
  fb.innerHTML = `
    <div class="feedback ${ok ? 'ok' : 'no'} pop" role="status">
      <div>${ok ? zh('答對了，好棒！') : zh('再想想！正確答案是 ') + `<b>${KEYS[rightIdx]}</b>`}</div>
      <div class="ex">${zh(Q.ex)}</div>
    </div>
    <div class="actions" style="margin-top:14px"><button class="btn" type="button" id="next">${zh(last ? '看成績' : '下一題')}</button></div>`;
  say(ok ? '答對了，好棒！' + Q.ex : '再想想！' + Q.ex);
  const nx = fb.querySelector('#next');
  nx.onclick = () => { cur++; if (last) finish(); else render(); box.scrollIntoView({ behavior: 'smooth', block: 'start' }); };
  nx.focus({ preventScroll: true });
}

function finish() {
  const n = results.filter(Boolean).length, total = order.length;
  const missed = [...new Set(order.filter((qi, k) => !results[k]).map(qi => QUESTIONS[qi].card))];
  const cheer = n === total ? '全部答對，你是行動牌高手！' : n >= total * 0.7 ? '很棒喔！再看看下面的牌。' : '沒關係，再看一次影片，再玩一次！';
  box.innerHTML = `
    <div class="result">
      <div class="stars pop">${results.map(r => STAR(r)).join('')}</div>
      <div class="score">${n} / ${total}</div>
      <div class="qtext" style="flex:none">${zh(cheer)}</div>
      ${missed.length ? `<div class="review"><h3>${zh('要再複習的牌')}</h3>${missed.map(k => `
        <div class="rv"><img src="${k}.png" alt=""><div class="tx"><div class="nm">${zh(CARDS[k].name)}</div><div>${zh(CARDS[k].desc)}</div></div></div>`).join('')}</div>` : ''}
      <div class="actions" style="justify-content:center"><button class="btn" type="button" id="again">${zh('再玩一次')}</button></div>
      <div class="teacher">老師小提示：選項每次都會重新排列，按「再玩一次」題目順序也會換。</div>
    </div>`;
  say(cheer);
  box.querySelector('#again').onclick = start;
}

start();
</script>

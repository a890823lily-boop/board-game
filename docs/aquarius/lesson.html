<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body><title>水瓶座出牌小妙招</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@700;900&display=swap">
<style>
/* Layout: classroom slideshow — one lesson step on screen at a time, step chips on top, big prev/next at the bottom; same warm poster look as the 水瓶座 app (deliberately light-only, every colour explicit) */
:root {
  color-scheme: light;
  --paper: #FFF8EA;
  --card: #FFFFFF;
  --line: #EFE4CF;
  --ink: #3B322C;
  --muted: #7C6F64;
  --blue: #2D5FA8;
  --blue-deep: #1D4482;
  --blue-soft: #E6EFFB;
  --red: #D93A2B;
  --felt: #E5EFE2;
  --felt-line: #C6DBC1;
  --good: #2E8B4E;
  --good-soft: #E1F3E6;
  --bad: #C2452F;
  --bad-soft: #FBE6E1;
  --warn: #B7791F;
  --warn-soft: #FDF1D8;
  --sun: #F7C948;
  --bean: #8A5A2B;
  --f-kid: "LXGW WenKai TC", "Kaiti TC", "DFKai-SB", "BiauKai", "Noto Sans TC", serif;
  --f-head: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
}
* { box-sizing: border-box; }
body {
  background: var(--paper); color: var(--ink);
  font-family: var(--f-kid); font-size: 20px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 40px;
}
.wrap { max-width: 1100px; margin: 0 auto; display: grid; gap: 20px; }
button { font: inherit; }
button:focus-visible, input:focus-visible { outline: 4px solid var(--sun); outline-offset: 3px; }

/* zhuyin (same construction as the app) */
.z { display: inline-flex; align-items: center; vertical-align: middle; margin-right: .08em; }
.z .h { line-height: 1.15; }
.z .b { display: inline-grid; grid-template-columns: auto .42em; align-items: center; font-size: .42em; line-height: 1; margin-left: .1em; font-weight: 400; }
.z .b i { grid-column: 1; font-style: normal; display: block; text-align: center; height: .9em; line-height: .9em; }
.z .b i.nt { height: .6em; line-height: .3em; }
.z .t { grid-column: 2; align-self: start; font-size: .8em; line-height: 1; transform: translateY(-.25em); }
.p { display: inline-block; }
.zt { display: inline; line-height: 1.8; }

/* header + step chips */
header { padding-block: 20px 0; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
header h1 { margin: 0; font-family: var(--f-head); font-weight: 900; color: var(--blue); font-size: clamp(28px, 5vw, 44px); }
header h1 .z .sy, header h1 .z .t { font-family: var(--f-head); }
.sub { color: var(--muted); font-size: 18px; margin: 0; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip {
  font-family: var(--f-head); font-weight: 700; font-size: 16px; cursor: pointer;
  border: 2px solid var(--line); background: var(--card); color: var(--muted);
  border-radius: 999px; padding: 4px 12px 6px; min-width: 40px;
}
.chip[aria-current="step"] { background: var(--blue); border-color: var(--blue); color: #fff; }
.chip.done { border-color: #BCD0EC; color: var(--blue); }

/* step panel */
.step {
  background: var(--card); border: 3px solid var(--line); border-radius: 28px;
  padding: clamp(16px, 3.5vw, 34px); display: grid; gap: 20px; min-width: 0;
}
.step-top { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.num {
  flex: none; width: 64px; height: 64px; border-radius: 50%; background: var(--blue); color: #fff;
  font-family: var(--f-head); font-weight: 900; font-size: 36px; display: grid; place-items: center;
  box-shadow: 0 5px 0 var(--blue-deep);
}
.step h2 { margin: 0; font-family: var(--f-head); font-weight: 900; color: var(--blue); font-size: clamp(30px, 5vw, 46px); text-wrap: balance; }
.step h2 .z .sy, .step h2 .z .t { font-family: var(--f-head); }
.lead { margin: 0; font-size: clamp(24px, 3.6vw, 34px); color: var(--red); font-weight: 700; }
.teacher { font-family: var(--f-head); font-size: 15px; color: var(--muted); background: var(--paper); border-radius: 12px; padding: 10px 14px; margin: 0; }
.teacher b { color: var(--blue); }

.speak {
  display: inline-flex; align-items: center; gap: 8px; cursor: pointer;
  font-size: 18px; font-weight: 700; color: var(--blue); background: var(--card);
  border: 2px solid #BCD0EC; border-radius: 999px; padding: 4px 14px 4px 10px; vertical-align: middle;
}
.speak svg { width: 22px; height: 22px; }

.nav { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.btn {
  font-family: var(--f-head); font-weight: 900; font-size: 22px; cursor: pointer;
  color: #fff; background: var(--blue); border: 0; border-radius: 999px; padding: 10px 28px 12px;
  box-shadow: 0 5px 0 var(--blue-deep);
}
.btn .z .sy, .btn .z .t { font-family: var(--f-head); }
.btn:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--blue-deep); }
.btn.ghost { background: var(--card); color: var(--blue); border: 2px solid #BCD0EC; box-shadow: 0 5px 0 #BCD0EC; }
.btn:disabled { opacity: .35; cursor: default; }

/* intro problems */
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
.box { border-radius: 22px; padding: 18px 20px; display: grid; gap: 8px; min-width: 0; }
.box.bad { background: var(--bad-soft); }
.box.good { background: var(--good-soft); }
.box h3 { margin: 0; font-family: var(--f-head); font-size: 24px; }
.box.bad h3 { color: var(--bad); }
.box.good h3 { color: var(--good); }
.box p { margin: 0; font-size: 24px; }

/* felt table + cards */
.felt { background: var(--felt); border: 3px solid var(--felt-line); border-radius: 22px; padding: 16px; display: grid; gap: 14px; min-width: 0; }
.board { position: relative; margin: 0 auto; }
.ecard { position: absolute; border-radius: 9%/7%; background: #1F1F24; padding: 5%; box-shadow: 0 4px 10px rgba(40,50,30,.28); transition: transform .2s ease; }
.ecard .in { width: 100%; height: 100%; display: grid; gap: 2px; border-radius: 6px; overflow: hidden; }
.ecard .s { position: relative; border-radius: 4px; overflow: hidden; }
.ecard .s svg { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
.ecard.mark { box-shadow: 0 0 0 5px var(--bad), 0 4px 10px rgba(40,50,30,.28); }
.ecard.new { box-shadow: 0 0 0 5px var(--sun), 0 4px 10px rgba(40,50,30,.28); }
.ecard.lit { box-shadow: 0 0 0 4px #FFE066, 0 4px 10px rgba(40,50,30,.28); }
.slot {
  position: absolute; border: 3px dashed #8FB4E3; border-radius: 9%/7%; background: rgba(255,255,255,.35);
  cursor: pointer; padding: 0;
}
.slot:hover, .slot:focus-visible { background: rgba(45,95,168,.15); border-color: var(--blue); }
.slot:disabled { cursor: default; opacity: .25; }
.hand { display: flex; gap: 14px; flex-wrap: wrap; align-items: flex-end; }
.hcard { position: relative; border: 0; background: none; padding: 0; cursor: pointer; border-radius: 10px; }
.hcard .ecard { position: relative; }
.hcard[aria-pressed="true"] .ecard { transform: translateY(-14px); box-shadow: 0 0 0 5px var(--blue), 0 10px 16px rgba(40,50,30,.3); }
.hcard:disabled { cursor: default; }
.hand-label { font-family: var(--f-head); font-weight: 700; color: var(--muted); font-size: 16px; }
.goalbar { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.goal { display: flex; align-items: center; gap: 12px; background: var(--card); border-radius: 16px; padding: 8px 16px 8px 8px; }
.goal .gc { width: 56px; height: 74px; border-radius: 8px; background: #1F1F24; display: grid; place-items: center; flex: none; }
.goal .gc span { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; border: 2px solid rgba(255,255,255,.7); }
.goal b { color: var(--red); font-size: 24px; }
.count { font-family: var(--f-head); font-weight: 900; color: var(--blue); font-size: 22px; background: var(--card); border-radius: 999px; padding: 6px 16px; }
.count.danger { color: var(--bad); }

.feedback { border-radius: 18px; padding: 14px 18px; font-size: clamp(21px, 3.2vw, 26px); font-weight: 700; display: grid; gap: 6px; }
.feedback.ok { background: var(--good-soft); color: var(--good); }
.feedback.no { background: var(--bad-soft); color: var(--bad); }
.feedback.mid { background: var(--warn-soft); color: var(--warn); }
.feedback .ex { color: var(--ink); font-weight: 400; font-size: .9em; }

.tabs { display: flex; gap: 10px; flex-wrap: wrap; }
.tab { cursor: pointer; font-family: var(--f-head); font-weight: 700; font-size: 18px; border-radius: 999px; padding: 6px 18px 8px; border: 2px solid #BCD0EC; background: var(--card); color: var(--blue); }
.tab[aria-selected="true"] { background: var(--blue); color: #fff; border-color: var(--blue); }
.tab .z .sy, .tab .z .t { font-family: var(--f-head); }

/* flowchart */
.flow { display: grid; gap: 0; justify-items: stretch; max-width: 820px; margin: 0 auto; width: 100%; }
.fstep { display: grid; grid-template-columns: 64px 1fr; gap: 16px; align-items: center; background: var(--card); border: 3px solid var(--line); border-radius: 22px; padding: 14px 18px; cursor: pointer; text-align: left; color: var(--ink); }
.fstep .n { width: 56px; height: 56px; border-radius: 50%; background: var(--blue-soft); color: var(--blue); font-family: var(--f-head); font-weight: 900; font-size: 30px; display: grid; place-items: center; }
.fstep .q { font-size: clamp(24px, 3.6vw, 32px); font-weight: 700; }
.fstep .a { font-size: clamp(19px, 2.8vw, 23px); color: var(--muted); }
.fstep.on { border-color: var(--blue); background: var(--blue-soft); }
.fstep.on .n { background: var(--blue); color: #fff; }
.arrow { display: flex; align-items: center; gap: 12px; padding: 6px 0 6px 40px; font-size: 21px; font-weight: 700; }
.arrow svg { width: 26px; height: 34px; flex: none; }
.yes { color: var(--good); }
.no-t { color: var(--bad); }
.mantra { text-align: center; font-family: var(--f-head); font-weight: 900; font-size: clamp(28px, 5vw, 44px); color: var(--red); margin: 0; }
.mantra .z .sy, .mantra .z .t { font-family: var(--f-head); }

/* action cards */
.acards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 16px; }
.acard { background: var(--card); border: 3px solid var(--line); border-radius: 22px; padding: 14px; display: grid; grid-template-columns: 76px 1fr; gap: 14px; align-items: start; min-width: 0; }
.acard img { width: 76px; border-radius: 8px; box-shadow: 0 3px 8px rgba(40,50,30,.2); }
.acard .nm { font-family: var(--f-head); font-weight: 900; color: var(--blue); font-size: 22px; }
.acard .nm .z .sy, .acard .nm .z .t { font-family: var(--f-head); }
.acard .ask { font-size: 22px; font-weight: 700; color: var(--red); }
.acard .why { font-size: 18px; color: var(--muted); }
.acard .tx { display: grid; gap: 6px; min-width: 0; }
.acard.today { border-color: var(--sun); }
.badge { justify-self: start; font-family: var(--f-head); font-size: 14px; font-weight: 700; border-radius: 999px; padding: 2px 10px 3px; background: var(--sun); color: var(--ink); }
.badge.adv { background: var(--blue-soft); color: var(--blue); }
.keep { background: var(--warn-soft); border-radius: 22px; padding: 16px 20px; font-size: clamp(24px, 3.6vw, 30px); font-weight: 700; color: var(--warn); }

/* doctor quiz */
.qtop { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.qno { font-family: var(--f-head); font-weight: 900; color: var(--blue); font-size: 20px; }
.dots { display: flex; gap: 7px; flex-wrap: wrap; }
.dot { width: 16px; height: 16px; border-radius: 50%; background: #EDE6DA; border: 2px solid #E0D6C6; }
.dot.now { background: var(--sun); border-color: #E3AE1B; }
.dot.ok { background: var(--good); border-color: var(--good); }
.dot.no { background: var(--bad); border-color: var(--bad); }
.situ { font-size: clamp(25px, 4vw, 34px); font-weight: 700; }
.opts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 700px) { .opts { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.opt {
  cursor: pointer; background: var(--card); border: 3px solid #DCD2C0; border-radius: 18px; padding: 12px;
  display: grid; justify-items: center; gap: 8px; text-align: center; color: var(--ink);
  font-size: 22px; font-weight: 700; box-shadow: 0 4px 0 #DCD2C0; min-width: 0;
}
.opt img { width: 100%; max-width: 110px; border-radius: 8px; }
.opt .hold { width: 100%; max-width: 110px; aspect-ratio: 5 / 7; border-radius: 8px; background: var(--warn-soft); border: 3px dashed var(--warn); display: grid; place-items: center; }
.opt .hold svg { width: 52px; height: 52px; }
.opt:disabled { cursor: default; }
.opt.right { border-color: var(--good); background: var(--good-soft); box-shadow: 0 4px 0 var(--good); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); box-shadow: 0 4px 0 var(--bad); }
.opt.fade { opacity: .45; }

/* sentence frames */
.frames { display: grid; gap: 14px; }
.frame { background: var(--blue-soft); border-radius: 20px; padding: 16px 20px; font-size: clamp(25px, 4vw, 34px); font-weight: 700; color: var(--blue); }
.frame u { text-decoration: none; display: inline-block; min-width: 3.2em; border-bottom: 4px solid var(--blue); margin: 0 .2em; }
.helper { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.helper div { background: var(--paper); border: 3px solid var(--line); border-radius: 18px; padding: 14px 16px; font-size: 24px; font-weight: 700; }

/* beans */
.beans { overflow-x: auto; }
.beans table { border-collapse: separate; border-spacing: 0 10px; width: 100%; min-width: 560px; }
.beans th { font-family: var(--f-head); font-size: 17px; color: var(--muted); text-align: left; padding: 0 10px; }
.beans td { background: var(--paper); padding: 10px; vertical-align: middle; }
.beans td:first-child { border-radius: 16px 0 0 16px; }
.beans td:last-child { border-radius: 0 16px 16px 0; }
.beans input { font: inherit; font-size: 22px; width: 100%; min-width: 0; border: 2px solid var(--line); border-radius: 12px; padding: 6px 10px; background: var(--card); color: var(--ink); }
.counter { display: flex; align-items: center; gap: 10px; }
.counter button { width: 44px; height: 44px; border-radius: 50%; border: 0; cursor: pointer; font-family: var(--f-head); font-weight: 900; font-size: 26px; line-height: 1; }
.counter .plus { background: var(--blue); color: #fff; }
.counter .minus { background: var(--card); color: var(--muted); border: 2px solid var(--line); }
.counter output { font-family: var(--f-head); font-weight: 900; font-size: 30px; min-width: 1.6em; text-align: center; font-variant-numeric: tabular-nums; color: var(--bean); }
.pile { display: flex; flex-wrap: wrap; gap: 3px; max-width: 160px; }
.pile i { width: 12px; height: 9px; border-radius: 50%; background: var(--bean); display: block; }
.pile i.act { background: var(--blue); }
.reset { font-family: var(--f-head); font-weight: 700; font-size: 15px; cursor: pointer; background: none; border: 2px solid var(--line); color: var(--muted); border-radius: 999px; padding: 4px 14px; }
.confirm { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-family: var(--f-head); font-size: 15px; }

.summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
.sum { background: var(--paper); border-radius: 20px; padding: 16px; display: grid; gap: 4px; text-align: center; }
.sum .big { font-family: var(--f-head); font-weight: 900; font-size: 44px; color: var(--bean); font-variant-numeric: tabular-nums; }
.sum .big.act { color: var(--blue); }
.sum .lb { font-size: 20px; }
.star-list { display: grid; gap: 10px; }
.star-list div { font-size: 22px; background: var(--paper); border-radius: 16px; padding: 10px 16px; }

footer { text-align: center; color: var(--muted); font-size: 15px; font-family: var(--f-head); }
@keyframes pop { 0% { transform: scale(.6); opacity: .3 } 70% { transform: scale(1.08) } 100% { transform: scale(1); opacity: 1 } }
.pop { animation: pop .3s ease-out; }
@media (prefers-reduced-motion: reduce) { .pop { animation: none; } .ecard { transition: none; } }
</style>

<div class="wrap">
  <header>
    <div>
      <h1 data-zh="水瓶座出牌小妙招"></h1>
      <p class="sub" data-zh="二年級資源班｜水瓶座總結課"></p>
    </div>
    <nav class="chips" id="chips" aria-label="上課步驟"></nav>
  </header>
  <main id="main"></main>
  <div class="nav">
    <button class="btn ghost" type="button" id="prev"></button>
    <button class="btn" type="button" id="next"></button>
  </div>
  <footer>水瓶座 Aquarius｜二年級資源班桌遊教學｜鍵盤左右鍵可以換頁</footer>

  for (const s of slots) html += `<button class="slot" type="button" data-x="${s.x}" data-y="${s.y}" aria-label="放在這裡" style="${pos(s.x, s.y)}width:${w}px;height:${h}px"></button>`;
  el.innerHTML = html;
  return w;
}

const CN = '零一二三四五六七八九十';
function mountPractice() {
  const P = PUZZLES[pz.i];

  main.querySelectorAll('[data-h]').forEach(b => b.onclick = () => { pz.sel = pz.sel === +b.dataset.h ? null : +b.dataset.h; render(); });
  main.querySelectorAll('.slot').forEach(b => {
    b.disabled = pz.sel === null;
    b.onclick = () => tryPlace(+b.dataset.x, +b.dataset.y);
  });
  const fb = document.getElementById('pzFb');
  if (pz.result) fb.innerHTML = pz.result;

function tryPlace(x, y) {
  const P = PUZZLES[pz.i];
  const map = toMap(P.board);
  const cs = P.hand[pz.sel];
  const again = `<div class="actions" style="display:flex;gap:12px;flex-wrap:wrap;margin-top:8px"><button class="btn ghost" type="button" id="pzAgain">${zh('再試一次')}</button>${pz.i < PUZZLES.length - 1 ? `<button class="btn" type="button" id="pzNext">${zh('下一題')}</button>` : ''}</div>`;
  if (!legal(map, x, y, cs)) {
    pz.result = `<div class="feedback no pop"><div>${zh('接不上喔！')}</div><div class="ex">${zh('碰到的地方，要有相同的元素才能接。')}</div></div>`;
    say('接不上喔！碰到的地方，要有相同的元素才能接。');
    render(); return;
  }
  const watch = P.type === 'block' ? P.danger : P.goal;
  const before = group(map, watch).length;
  const after = (() => { const m = new Map(map); m.set(key(x, y), { x, y, cs }); return group(m, watch).length; })();
  let cls, msg, ex;
  if (P.type === 'build') {
    let best = 0;
    P.hand.forEach(h => slotsOf(map).forEach(s => { if (legal(map, s.x, s.y, h)) { const m = new Map(map); m.set(key(s.x, s.y), { x: s.x, y: s.y, cs: h }); best = Math.max(best, group(m, watch).length); } }));
    if (after === best) { cls = 'ok'; msg = `答對了！${EL[watch].name}連成${CN[after]}張！`; ex = '你先找到自己的元素，再讓它們碰在一起。'; }
    else if (after > before) { cls = 'mid'; msg = `有幫到自己，${EL[watch].name}連成${CN[after]}張。`; ex = '還有更好的地方嗎？比一比，哪裡連得最多？'; }
    else { cls = 'no'; msg = `${EL[watch].name}沒有變多喔。`; ex = '想一想：①看任務 ②找元素 ③碰一起。你的元素有碰在一起嗎？'; }
  } else {
    if (after > before) { cls = 'no'; msg = `糟糕！${P.rival}的草地變成${CN[after]}張了。`; ex = '這張牌碰到小美的草地了，換一個地方試試看。'; }
    else { cls = 'ok'; msg = '答對了！沒有幫到小美。'; ex = '手牌沒有我的元素時，就放在不會幫到別人的地方。'; }
  }
  pz.placed = { x, y, h: pz.sel }; pz.sel = null;
  pz.result = `<div class="feedback ${cls} pop" role="status"><div>${zh(msg)}</div><div class="ex">${zh(ex)}</div></div>${again}`;
  say(msg + ex);
  render();
}

    </div>
    ${fb}
    <p class="teacher"><b>老師提示</b>：請學生先說「我選＿＿，因為＿＿」，再點選。第四題的答案是「先留著」。</p>
  </section>`;
}
function mountDoctor() {
  main.querySelectorAll('[data-opt]').forEach(b => b.onclick = () => {
    const Q = DOCTOR[dq.i];
    dq.picked = b.dataset.opt;
    dq.results[dq.i] = dq.picked === Q.a;
    say((dq.picked === Q.a ? '答對了，好棒！' : '再想想！') + Q.ex);
    render();
  });
  const nx = document.getElementById('dqNext');
  if (nx) nx.onclick = () => { dq.i++; dq.picked = null; render(); };
  const ag = document.getElementById('dqAgain');
  if (ag) ag.onclick = () => { dq = { i: 0, picked: null, results: [] }; render(); };
}

/* play */
function stepPlay() {
  return `<section class="step">
    ${head(7, '實戰：先說，再出牌', '出牌前，先說一句話！')}
    <div class="frames">
      <div class="frame">${zh('我的元素是')}<u></u>${zh('，我放這裡，因為')}<u></u>${zh('。')}</div>
      <div class="frame">${zh('我用')}<u></u>${zh('，因為')}<u></u>${zh('。')}</div>
      <div class="frame">${zh('我先留著，因為')}<u></u>${zh('。')}</div>
    </div>
    <p class="lead">${zh('小幫手只問問題，不幫忙出牌：')}</p>
    <div class="helper">
      <div>${zh('① 你的元素是什麼？')}</div>
      <div>${zh('② 在哪裡？')}</div>
      <div>${zh('③ 有碰在一起嗎？')}</div>
    </div>
    <p class="teacher"><b>老師提示</b>：出牌幫到自己的元素拿一顆豆子；用對行動牌（或該留著時有留著）再拿一顆。下一頁可以直接記錄。</p>
  </section>`;
}

/* beans */
const STORE = 'aquarius-beans-v1';
let beans = (() => {
  try { const d = JSON.parse(localStorage.getItem(STORE)); if (d && d.length === 7) return d; } catch (e) {}
  return Array.from({ length: 7 }, (_, i) => ({ name: `${i + 1}號`, self: 0, act: 0 }));
})();
const saveBeans = () => { try { localStorage.setItem(STORE, JSON.stringify(beans)); } catch (e) {} };
let askReset = false;
function pile(n, act) { return `<span class="pile" aria-hidden="true">${`<i class="${act ? 'act' : ''}"></i>`.repeat(Math.min(n, 30))}</span>`; }
function stepBeans() {
  const rows = beans.map((b, i) => `<tr>
    <td style="width:24%"><input id="bn${i}" data-name="${i}" value="${b.name.replace(/"/g, '&quot;')}" aria-label="學生名字"></td>
    <td><div class="counter"><button class="minus" type="button" data-b="${i}" data-k="self" data-d="-1" aria-label="減一顆">−</button><output>${b.self}</output><button class="plus" type="button" data-b="${i}" data-k="self" data-d="1" aria-label="加一顆">+</button>${pile(b.self)}</div></td>
    <td><div class="counter"><button class="minus" type="button" data-b="${i}" data-k="act" data-d="-1" aria-label="減一顆">−</button><output>${b.act}</output><button class="plus" type="button" data-b="${i}" data-k="act" data-d="1" aria-label="加一顆">+</button>${pile(b.act, true)}</div></td>
  </tr>`).join('');
  return `<section class="step">
    ${head(8, '豆子紀錄', '幫到自己，就拿一顆豆子！')}
    <div class="beans"><table>
      <thead><tr><th>${zh('名字')}</th><th>${zh('幫到自己的元素')}</th><th>${zh('用對行動牌')}</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
    <div class="confirm">
      ${askReset ? `<span>確定要把豆子全部歸零嗎？</span><button class="reset" type="button" id="resetYes">歸零</button><button class="reset" type="button" id="resetNo">取消</button>`
                 : `<button class="reset" type="button" id="resetAsk">全部歸零</button><span style="color:var(--muted)">紀錄只存在這台電腦的瀏覽器裡。</span>`}
    </div>
  </section>`;
}
function mountBeans() {
  main.querySelectorAll('[data-b]').forEach(b => b.onclick = () => {
    const s = beans[+b.dataset.b], k = b.dataset.k;
    s[k] = Math.max(0, s[k] + +b.dataset.d); saveBeans(); render();
  });
  main.querySelectorAll('[data-name]').forEach(inp => inp.oninput = () => { beans[+inp.dataset.name].name = inp.value; saveBeans(); });
  const a = document.getElementById('resetAsk'); if (a) a.onclick = () => { askReset = true; render(); };
  const y = document.getElementById('resetYes'); if (y) y.onclick = () => { beans.forEach(b => { b.self = 0; b.act = 0; }); askReset = false; saveBeans(); render(); };
  const n = document.getElementById('resetNo'); if (n) n.onclick = () => { askReset = false; render(); };
}

/* wrap up */
function stepWrap() {
  const self = beans.reduce((s, b) => s + b.self, 0), act = beans.reduce((s, b) => s + b.act, 0);
  return `<section class="step">
    ${head(9, '數豆子：我進步了！', '這一場，你幫到自己幾次？')}
    <div class="summary">
      <div class="sum"><div class="big">${self}</div><div class="lb">${zh('全班幫到自己的元素')}</div></div>
      <div class="sum"><div class="big act">${act}</div><div class="lb">${zh('全班用對行動牌')}</div></div>
    </div>
    <p class="lead">${zh('每個人說一句：')}</p>
    <div class="star-list">
      <div>${zh('我學到最厲害的一招是')}<u style="text-decoration:none;display:inline-block;min-width:4em;border-bottom:3px solid var(--ink)"></u>${zh('。')}</div>
      <div>${zh('下次玩，我要記得')}<u style="text-decoration:none;display:inline-block;min-width:4em;border-bottom:3px solid var(--ink)"></u>${zh('。')}</div>
    </div>
    <p class="mantra">${zh('看任務、找元素、碰一起')}</p>
  </section>`;
}

/* ---------- shell ---------- */
const MOUNT = { xiaoming: mountXiaoming, flow: mountFlow, practice: mountPractice, doctor: mountDoctor, beans: mountBeans };
function render() {
  const S = STEPS[cur];
  chips.innerHTML = STEPS.map((s, i) => `<button class="chip ${i < cur ? 'done' : ''}" type="button" data-step="${i}" ${i === cur ? 'aria-current="step"' : ''} aria-label="第${i + 1}步：${s.label}">${i + 1}</button>`).join('');
  chips.querySelectorAll('[data-step]').forEach(b => b.onclick = () => go(+b.dataset.step));
  const scrollY = window.scrollY;
  main.innerHTML = S.render();
  zhAll(main);
  main.querySelectorAll('[data-say]').forEach(b => b.onclick = () => say(b.dataset.say));
  (MOUNT[S.id] || (() => {}))();
  const again = document.getElementById('pzAgain'); if (again) again.onclick = () => { pz.placed = null; pz.result = null; render(); };
  const pnext = document.getElementById('pzNext'); if (pnext) pnext.onclick = () => { pz = { i: pz.i + 1, sel: null, placed: null }; render(); };
  const prev = document.getElementById('prev'), next = document.getElementById('next');
  prev.innerHTML = zh('上一步'); next.innerHTML = zh(cur === STEPS.length - 1 ? '回到開始' : '下一步');
  prev.disabled = cur === 0;
  window.scrollTo(0, scrollY);
}
function go(i) {
  cur = (i + STEPS.length) % STEPS.length;
  if (location.hash !== '#' + STEPS[cur].id) history.replaceState(null, '', '#' + STEPS[cur].id);
  render();
  document.querySelector('.wrap').scrollIntoView({ block: 'start' });
}
document.getElementById('prev').onclick = () => go(cur - 1);
document.getElementById('next').onclick = () => go(cur === STEPS.length - 1 ? 0 : cur + 1);
document.addEventListener('keydown', e => {
  if (e.target.closest('input')) return;
  if (e.key === 'ArrowRight') go(cur + 1 >= STEPS.length ? cur : cur + 1);
  if (e.key === 'ArrowLeft') go(Math.max(0, cur - 1));
});
function fromHash() { const i = STEPS.findIndex(s => '#' + s.id === location.hash); if (i >= 0) { cur = i; render(); } }
window.addEventListener('hashchange', fromHash);
let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { if (['xiaoming', 'practice'].includes(STEPS[cur].id)) render(); }, 150); });
zhAll(document.querySelector('header'));
const start = STEPS.findIndex(s => '#' + s.id === location.hash);
cur = start >= 0 ? start : 0;
render();
</script>

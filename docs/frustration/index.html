<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body><title>輸了也沒關係</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: classroom slideshow for a 40-minute frustration-tolerance lesson; one step per screen, step chips + timer on top, big prev/next below. Calm teal-and-peach classroom look, deliberately light-only with every colour explicit. */
:root {
  color-scheme: light;
  --paper: #FBF6EE;
  --card: #FFFFFF;
  --line: #EBE2D3;
  --ink: #33302B;
  --muted: #7A7064;
  --teal: #237A80;
  --teal-deep: #185A5F;
  --teal-soft: #DDF0EF;
  --peach: #F08A5D;
  --peach-soft: #FDEADF;
  --good: #2E8B57;
  --good-soft: #E2F3E8;
  --bad: #C64B3B;
  --bad-soft: #FBE5E1;
  --sun: #F4C24B;
  --t1: #6CC08B; --t2: #A9D46B; --t3: #F4C24B; --t4: #F08A5D; --t5: #D9534F;
  --f-kid: "LXGW WenKai TC", "Kaiti TC", "DFKai-SB", "BiauKai", "Noto Sans TC", serif;
  --f-head: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background: var(--paper); color: var(--ink); font-family: var(--f-kid); font-size: 20px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 40px;
}
.wrap { max-width: 1100px; margin: 0 auto; display: grid; gap: 18px; }
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible { outline: 4px solid var(--sun); outline-offset: 3px; }

.z { display: inline-flex; align-items: center; vertical-align: middle; margin-right: .08em; }
.z .h { line-height: 1.15; }
.z .b { display: inline-grid; grid-template-columns: auto .42em; align-items: center; font-size: .42em; line-height: 1; margin-left: .1em; font-weight: 400; }
.z .b i { grid-column: 1; font-style: normal; display: block; text-align: center; height: .9em; line-height: .9em; }
.z .b i.nt { height: .6em; line-height: .3em; }
.z .t { grid-column: 2; align-self: start; font-size: .8em; line-height: 1; transform: translateY(-.25em); }
.p { display: inline-block; }
.zt { display: inline; line-height: 1.8; }
body.nozy .z .b { display: none; }
body.nozy .zt { line-height: 1.5; }
.hd .z .b i, .hd .z .t { font-family: var(--f-head); }

header { padding-block: 18px 0; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
header h1 { margin: 0; font-family: var(--f-head); font-weight: 900; color: var(--teal); font-size: clamp(28px, 5vw, 42px); }
.tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.pillbtn { cursor: pointer; border: 2px solid var(--line); background: var(--card); border-radius: 999px; padding: 4px 14px; font-family: var(--f-head); font-weight: 700; font-size: 15px; color: var(--muted); }
.timer { display: flex; align-items: center; gap: 6px; background: var(--card); border: 2px solid var(--line); border-radius: 999px; padding: 3px 6px 3px 12px; font-family: var(--f-head); font-weight: 900; }
.timer output { font-size: 18px; min-width: 3.2em; font-variant-numeric: tabular-nums; color: var(--teal); }
.timer output.over { color: var(--bad); }
.timer button { border: 0; cursor: pointer; border-radius: 999px; padding: 3px 10px; font-family: var(--f-head); font-weight: 700; font-size: 13px; background: var(--teal-soft); color: var(--teal); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { cursor: pointer; font-family: var(--f-head); font-weight: 700; font-size: 14px; border: 2px solid var(--line); background: var(--card); color: var(--muted); border-radius: 999px; padding: 3px 11px 5px; }
.chip[aria-current="step"] { background: var(--teal); border-color: var(--teal); color: #fff; }

.step { background: var(--card); border: 3px solid var(--line); border-radius: 28px; padding: clamp(16px, 3.4vw, 32px); display: grid; gap: 18px; min-width: 0; }
.step-top { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.num { flex: none; width: 60px; height: 60px; border-radius: 50%; background: var(--teal); color: #fff; font-family: var(--f-head); font-weight: 900; font-size: 32px; display: grid; place-items: center; box-shadow: 0 5px 0 var(--teal-deep); }
.step h2 { margin: 0; font-family: var(--f-head); font-weight: 900; color: var(--teal); font-size: clamp(28px, 4.6vw, 42px); text-wrap: balance; }
.mins { font-family: var(--f-head); font-weight: 700; font-size: 15px; color: var(--muted); background: var(--paper); border-radius: 999px; padding: 3px 12px; }
.lead { margin: 0; font-size: clamp(24px, 3.6vw, 32px); color: var(--peach); font-weight: 700; }
.big { margin: 0; font-size: clamp(24px, 3.8vw, 34px); font-weight: 700; }
.teacher { font-family: var(--f-head); font-size: 15px; color: var(--muted); background: var(--paper); border-radius: 12px; padding: 10px 14px; margin: 0; line-height: 1.6; }
.teacher b { color: var(--teal); }
.speak { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; font-size: 17px; font-weight: 700; color: var(--teal); background: var(--card); border: 2px solid #B9DCDA; border-radius: 999px; padding: 3px 12px 3px 8px; vertical-align: middle; }
.speak svg { width: 20px; height: 20px; }
.nav { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.btn { cursor: pointer; font-family: var(--f-head); font-weight: 900; font-size: 21px; color: #fff; background: var(--teal); border: 0; border-radius: 999px; padding: 10px 26px 12px; box-shadow: 0 5px 0 var(--teal-deep); }
.btn:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--teal-deep); }
.btn.ghost { background: var(--card); color: var(--teal); border: 2px solid #B9DCDA; box-shadow: 0 5px 0 #B9DCDA; }
.btn.peach { background: var(--peach); box-shadow: 0 5px 0 #C46A42; }
.btn:disabled { opacity: .35; cursor: default; }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }

/* 3D game */
.lvpick { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); gap: 12px; }
.lvcard { position: relative; cursor: pointer; text-align: left; background: var(--card); border: 3px solid var(--line); border-left: 12px solid var(--c); border-radius: 22px; padding: 14px 16px; display: grid; gap: 6px; box-shadow: 0 4px 0 var(--line); }
.lvcard .ic { width: 54px; height: 54px; border-radius: 50%; background: var(--c); color: #fff; display: grid; place-items: center; font-size: 26px; font-weight: 700; }
.lvcard .nm { font-family: var(--f-head); font-weight: 900; font-size: clamp(22px, 3.2vw, 27px); color: var(--ink); }
.lvcard .ds { font-size: 19px; color: var(--muted); }
.lvcard .st { position: absolute; top: 10px; right: 14px; font-size: 36px; color: var(--sun); line-height: 1; }
.g3d { position: relative; aspect-ratio: 16 / 9; width: 100%; border-radius: 22px; overflow: hidden; background: #22333A; border: 6px solid #22333A; }
.g3d-stage, .g3d-stage canvas { position: absolute; inset: 0; width: 100% !important; height: 100% !important; display: block; }
.g3d-fallback { color: #fff; display: grid; place-items: center; height: 100%; font-size: 22px; padding: 20px; text-align: center; }
.g3d-hud { position: absolute; left: 50%; top: 4%; transform: translateX(-50%); background: rgba(20,24,28,.78); color: #fff; border-radius: 14px; padding: 4px 16px 6px; font-size: clamp(16px, 2.6vw, 24px); font-weight: 700; text-align: center; max-width: 94%; pointer-events: none; }
.g3d-hud:empty { display: none; }
.g3d-hud .cd { font-family: var(--f-head); font-weight: 900; font-size: clamp(24px, 5vw, 44px); color: var(--sun); }
.g3d-meter { position: absolute; left: 6%; right: 6%; bottom: 6%; height: 26px; background: rgba(255,255,255,.85); border: 3px solid #22333A; border-radius: 14px; overflow: hidden; }
.g3d-meter b { position: absolute; left: 54%; width: 16%; top: 0; bottom: 0; background: #6CC08B; }
.g3d-meter i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-right: 6px solid #D9534F; }
.g3d-ctl { justify-content: center; }
.g3act { font-size: clamp(24px, 4vw, 32px); padding: 14px 40px 16px; touch-action: manipulation; user-select: none; -webkit-user-select: none; min-width: min(100%, 320px); }
.g3panel { display: grid; gap: 14px; }
.g3panel:empty { display: none; }
.thermo5 { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.thermo5 button { cursor: pointer; border: 3px solid var(--line); background: var(--card); border-radius: 18px; padding: 8px 4px; display: grid; justify-items: center; gap: 2px; font-family: var(--f-head); font-size: 24px; color: var(--ink); }
.thermo5 button svg { width: min(56px, 100%); height: auto; }
.thermo5 button.on { border-color: var(--c); background: var(--paper); box-shadow: 0 0 0 4px var(--c) inset; }

/* choices */
.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 12px; }
.opt { cursor: pointer; background: var(--card); border: 3px solid var(--line); border-radius: 20px; padding: 14px; font-size: clamp(21px, 3.2vw, 27px); font-weight: 700; display: grid; justify-items: center; gap: 6px; text-align: center; box-shadow: 0 4px 0 var(--line); }
.opt svg { width: 72px; height: 72px; }
.opt.right { border-color: var(--good); background: var(--good-soft); box-shadow: 0 4px 0 var(--good); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); box-shadow: 0 4px 0 var(--bad); }
.opt.on { border-color: var(--teal); background: var(--teal-soft); box-shadow: 0 4px 0 var(--teal); }
.opt:disabled { cursor: default; }
.fb { border-radius: 18px; padding: 12px 16px; font-size: clamp(21px, 3.2vw, 26px); font-weight: 700; display: grid; gap: 4px; }
.fb.ok { background: var(--good-soft); color: var(--good); }
.fb.no { background: var(--bad-soft); color: var(--bad); }
.fb.info { background: var(--teal-soft); color: var(--teal); }
.fb .ex { color: var(--ink); font-weight: 400; }

/* thermometer */
.thermo { display: grid; grid-template-columns: 96px 1fr; gap: 18px; align-items: stretch; }
@media (max-width: 640px) { .thermo { grid-template-columns: 70px 1fr; } }
.tube { position: relative; border-radius: 48px; background: #F1ECE3; border: 4px solid var(--line); display: flex; flex-direction: column-reverse; overflow: hidden; min-height: 420px; }
.tube button { flex: 1; border: 0; cursor: pointer; font-family: var(--f-head); font-weight: 900; font-size: 28px; color: #fff; opacity: .35; }
.tube button.on { opacity: 1; }
.levels { display: grid; gap: 10px; }
.lv { cursor: pointer; display: grid; grid-template-columns: 64px 1fr; gap: 14px; align-items: center; background: var(--card); border: 3px solid var(--line); border-radius: 18px; padding: 10px 14px; text-align: left; }
.lv svg { width: 60px; height: 60px; }
.lv .nm { font-size: clamp(21px, 3.2vw, 26px); font-weight: 700; }
.lv .ds { font-size: clamp(17px, 2.4vw, 20px); color: var(--muted); }
.lv .todo { font-size: clamp(17px, 2.4vw, 20px); color: var(--teal); font-weight: 700; }
.lv.on { border-color: var(--teal); background: var(--teal-soft); }

/* calm tools */
.tools4 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); gap: 12px; }
.tool { cursor: pointer; border: 3px solid var(--line); background: var(--card); border-radius: 22px; padding: 14px; display: grid; gap: 6px; justify-items: center; text-align: center; box-shadow: 0 4px 0 var(--line); }
.tool svg { width: 80px; height: 80px; }
.tool .nm { font-size: clamp(22px, 3.2vw, 27px); font-weight: 700; color: var(--teal); }
.tool .ds { font-size: 18px; color: var(--muted); }
.tool.on { border-color: var(--teal); background: var(--teal-soft); box-shadow: 0 4px 0 var(--teal); }
.guide { background: var(--teal-soft); border-radius: 24px; padding: 20px; display: grid; justify-items: center; gap: 12px; text-align: center; min-height: 260px; align-content: center; }
.guide .gbig { font-family: var(--f-head); font-weight: 900; font-size: clamp(40px, 8vw, 72px); color: var(--teal); line-height: 1.1; }
.guide .gtxt { font-size: clamp(24px, 4vw, 34px); font-weight: 700; }
.guide svg.anim { width: 160px; height: 160px; transition: transform 3s ease-in-out; }

/* thoughts */
.flips { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 14px; }
.flip { cursor: pointer; border: 0; padding: 0; background: none; perspective: 900px; min-height: 170px; }
.flip .in { position: relative; width: 100%; height: 100%; min-height: 170px; transform-style: preserve-3d; transition: transform .7s cubic-bezier(.3,1.3,.5,1); }
.flip.on .in { transform: rotateY(180deg); }
.flip .face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 22px; padding: 16px; display: grid; place-items: center; text-align: center; gap: 6px; }
.flip .bad { background: #EDE7F1; border: 3px solid #CDBEDB; color: #5C4A70; }
.flip .good { background: var(--good-soft); border: 3px solid #A8D8B9; color: var(--good); transform: rotateY(180deg); }
.flip .face b { font-size: clamp(23px, 3.4vw, 29px); }
.flip .face small { font-family: var(--f-head); font-size: 14px; opacity: .8; }

/* spinner practice */
.practice { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 18px; align-items: start; }
@media (max-width: 760px) { .practice { grid-template-columns: 1fr; } }
.wheel-wrap { position: relative; width: min(340px, 100%); margin: 0 auto; aspect-ratio: 1; }
.wheel-wrap svg { width: 100%; height: 100%; }
#wheel { transition: transform 3.2s cubic-bezier(.15,.85,.2,1); transform-origin: 50% 50%; }
.pointer { position: absolute; left: 50%; top: -6px; transform: translateX(-50%); width: 0; height: 0; border-left: 18px solid transparent; border-right: 18px solid transparent; border-top: 34px solid var(--ink); }
.who { display: flex; gap: 6px; flex-wrap: wrap; }
.who button { cursor: pointer; border: 2px solid var(--line); background: var(--card); border-radius: 999px; padding: 4px 12px; font-family: var(--f-head); font-weight: 700; font-size: 16px; }
.who button[aria-pressed="true"] { background: var(--teal); color: #fff; border-color: var(--teal); }
.checks { display: grid; gap: 8px; }
.ck { cursor: pointer; display: flex; gap: 12px; align-items: center; background: var(--card); border: 3px solid var(--line); border-radius: 16px; padding: 10px 14px; font-size: clamp(20px, 3vw, 24px); font-weight: 700; text-align: left; }
.ck .box { width: 30px; height: 30px; border-radius: 8px; border: 3px solid var(--line); flex: none; display: grid; place-items: center; color: #fff; font-size: 20px; font-family: var(--f-head); }
.ck.on { border-color: var(--good); background: var(--good-soft); }
.ck.on .box { background: var(--good); border-color: var(--good); }
.board { display: grid; gap: 6px; }
.brow { display: grid; grid-template-columns: minmax(0, 6em) 1fr auto; gap: 10px; align-items: center; background: var(--paper); border-radius: 12px; padding: 6px 12px; }
.brow .nm { font-family: var(--f-head); font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.brow .st { color: var(--sun); letter-spacing: 1px; overflow: hidden; white-space: nowrap; font-size: 22px; }
.brow b { font-family: var(--f-head); font-variant-numeric: tabular-nums; }
.names input { font: inherit; font-size: 16px; border: 2px solid var(--line); border-radius: 10px; padding: 4px 8px; width: 100%; min-width: 0; }
.names { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 120px), 1fr)); gap: 6px; }
details summary { cursor: pointer; font-family: var(--f-head); font-weight: 700; color: var(--muted); font-size: 15px; }

/* plan card */
.plan { border: 6px double var(--teal); border-radius: 24px; padding: 18px 20px; display: grid; gap: 12px; background: #FFFDF8; }
.plan h3 { margin: 0; font-family: var(--f-head); color: var(--teal); font-size: 28px; }
.prow { display: grid; grid-template-columns: 8.5em 1fr; gap: 10px; align-items: start; border-top: 2px dashed var(--line); padding-top: 10px; }
@media (max-width: 560px) { .prow { grid-template-columns: 1fr; } }
.prow > b { color: var(--peach); font-size: 22px; }
.picks { display: flex; gap: 8px; flex-wrap: wrap; }
.picks button { cursor: pointer; border: 2px solid var(--line); background: var(--card); border-radius: 999px; padding: 4px 14px; font-size: 20px; font-weight: 700; }
.picks button[aria-pressed="true"] { background: var(--teal); color: #fff; border-color: var(--teal); }
.motto { text-align: center; font-family: var(--f-head); font-weight: 900; font-size: clamp(26px, 4.6vw, 40px); color: var(--peach); margin: 0; }
footer { text-align: center; color: var(--muted); font-size: 14px; font-family: var(--f-head); }
@keyframes pop { 0% { transform: scale(.7); opacity: .4 } 70% { transform: scale(1.05) } 100% { transform: scale(1); opacity: 1 } }
.pop { animation: pop .3s ease-out; }
@media (prefers-reduced-motion: reduce) { .pop { animation: none; } #wheel, .flip .in, .guide svg.anim { transition: none; } }
</style>

  <header>
    <h1 class="hd" data-zh="輸了也沒關係"></h1>
    <div class="tools">
      <div class="timer" aria-label="計時器"><output id="clock">0:00</output><button type="button" id="tgo">開始</button><button type="button" id="treset">重來</button></div>
      <button class="pillbtn" type="button" id="zyBtn">注音：開</button>
    </div>
  </header>
  <nav class="chips" id="chips" aria-label="上課步驟"></nav>

function setupChairs(ui) {
  const S = G.scene; S.background = new THREE.Color(0xF6EBD9); S.fog = null;

  const wall = mesh(new THREE.BoxGeometry(40, 8, 0.2), 0xFBF6EE); wall.position.set(0, 4, -8); S.add(wall);
  const board = mesh(new THREE.BoxGeometry(6, 2.4, 0.1), 0x2F5D4A); board.position.set(0, 3.6, -7.85); S.add(board);
  const chairs = [0, 1, 2].map(i => {
    const a = i * Math.PI * 2 / 3 + Math.PI / 2, c = new THREE.Group();
    const seat = mesh(new THREE.BoxGeometry(0.7, 0.08, 0.7), 0xC4552A); seat.position.y = 0.55;
    const back = mesh(new THREE.BoxGeometry(0.7, 0.7, 0.08), 0xC4552A); back.position.set(0, 0.95, -0.31);
    c.add(seat, back);
    [[-.3, -.3], [.3, -.3], [-.3, .3], [.3, .3]].forEach(([x, z]) => { const l = mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.55), 0x6B4A2B); l.position.set(x, 0.27, z); c.add(l); });
    c.position.set(Math.cos(a) * 1.3, 0, Math.sin(a) * 1.3); c.rotation.y = Math.PI / 2 - a;
    S.add(c); return { g: c, a, taken: null };
  });
  const ppl = [
    { p: person(0xF4C24B, 0x3B2A20, '你', true), you: true, name: '你' },
    { p: person(0xE87FA4, 0x5A3A2A, '小美'), delay: 0.42, name: '小美' },
    { p: person(0x6FA8DC, 0x2A2A2A, '小華'), delay: 0.5, name: '小華' },
    { p: person(0x8FCB6B, 0x6B3A1A, '小安'), delay: 0.58, name: '小安' },
  ];
  ppl.forEach((o, i) => { o.ang = i * Math.PI / 2; o.seat = null; S.add(o.p); });
  G.camera.position.set(0, 6.5, 7.5); G.camera.lookAt(0, 0.8, 0);
  let state = 'ready', stopAt = 0, tStop = 0, pressed = -1, ph = 0, endT = 0, fx = null, outGuy = null;
  const place = () => ppl.forEach(o => { if (o.seat) return; o.p.position.set(Math.cos(o.ang) * 2.5, 0, Math.sin(o.ang) * 2.5); o.p.rotation.y = -o.ang; });
  place();
  ui.hud(zh('按「開始放音樂」，大家繞著椅子走'));
  ui.action('開始放音樂', () => {
    if (state === 'ready') { state = 'walk'; stopAt = 3.5 + Math.random() * 3.5; startMusic(); ui.label('坐下！'); ui.hud(zh('音樂在放……準備好！')); return; }
    if (state === 'walk') { ui.hud(zh('音樂還沒停，再等一下！')); return; }
    if (state === 'stop' && pressed < 0) { pressed = tStop; }
  }, true);
  ui.enable(true);
  G.tick = dt => {
    if (state === 'walk') {
      stopAt -= dt; ph += dt * 7;
      ppl.forEach(o => { o.ang += dt * 0.7; animWalk(o.p, ph); });
      place();
      if (stopAt <= 0) { state = 'stop'; tStop = 0; stopMusic(); beep(300, 0.25); ui.hud(`<span class="cd">${zh('音樂停了！快坐下！')}</span>`); }

        o.p.position.lerpVectors(o.from, new THREE.Vector3(c.x, 0, c.z), o.k);

        if (ball.position.y < 0.2) fly.phase = 'done';
      } else if (fly.phase === 'bounce') {
        fly.v.y -= 9.8 * dt; ball.position.addScaledVector(fly.v, dt);
        if (ball.position.y < 0.16) { ball.position.y = 0.16; fly.v.y *= -0.45; fly.v.z *= 0.7; if (Math.abs(fly.v.y) < 0.6) fly.phase = 'done'; }
      } else if (fly.phase === 'done') {
        endT += dt;
        if (endT > 0.6) {
          endT = 0; fly = null; hud();
          if (shots >= SHOTS) {
            state = 'over'; ui.enable(false); ui.meter(false);
            const won = made > HUAS;
            if (won) fx = confetti(new THREE.Vector3(0, 2.5, -2));
            ui.hud(`<span class="cd">${zh(won ? `你投進 ${made} 球，贏了！` : `你投進 ${made} 球，小華投進 ${HUAS} 球`)}</span>`);
            ui.finish(won, won ? `你投進 ${made} 球，比小華多！` : `你投進 ${made} 球，小華投進 ${HUAS} 球，這次小華贏了。`, [hua]);
          } else { state = 'aim'; ball.position.copy(start); }
        }
      }
      return;
    }
    if (state === 'over') { if (fx) fx(dt); if (G.react) G.react(dt); }
  };
}

  if (!G.scene) return;
  const npcs = G.npcs || [];
  npcs.forEach(p => { p.userData.baseY = p.userData.baseY ?? p.position.y; p.userData.rotTo = faceCam(p) + Math.PI; p.position.y = p.userData.baseY; });
  beep(260, .3);
  G.react = dt => {
    npcs.forEach(p => {
      p.rotation.y += (p.userData.rotTo - p.rotation.y) * Math.min(1, dt * 3);
      const u = p.userData; u.armL.rotation.x += (0 - u.armL.rotation.x) * dt * 5; u.armR.rotation.x = u.armL.rotation.x;
    });
  };
}

/* 4 thoughts */
const THOUGHTS = [
  ['我最爛了！', '我只是這次沒拿到，下次再試試。'],
  ['我都比別人慢！', '每個人快慢不一樣，我會越來越快。'],
  ['不公平！我不要玩了！', '有輸有贏才好玩，再玩一局吧！'],
  ['大家都會笑我。', '好朋友不會笑我，我也不笑別人。'],
  ['沒得分就不好玩。', '跟朋友一起玩，本來就很開心！'],
];
let flipped = [];
function sThink() {
  return `<section class="step">${head(4, '想法變身', 5)}
    <p class="lead">${zh('輸了的時候，腦袋裡會跑出「難過的想法」。點一下，把它變成「幫助自己的想法」！')}</p>
    <div class="flips">${THOUGHTS.map(([a, b], i) => `<button class="flip ${flipped.includes(i) ? 'on' : ''}" type="button" data-th="${i}" aria-label="${a}"><div class="in"><div class="face bad"><small>${zh('難過的想法')}</small><b>${zh(a)}</b><small>${zh('點我變身')}</small></div><div class="face good"><small>${zh('幫助自己的想法')}</small><b>${zh(b)}</b></div></div></button>`).join('')}</div>
    <p class="teacher"><b>老師提示</b>：第二張「我都比別人慢」最貼近這次的狀況，可以多停留，讓學生說說自己擅長什麼（例如觀察很仔細、很有耐心）。翻完後全班一起大聲念好想法。</p>
  </section>`;
}
function mThink() { main.querySelectorAll('[data-th]').forEach(b => b.onclick = () => { const i = +b.dataset.th; if (!flipped.includes(i)) { flipped.push(i); b.classList.add('on'); say(THOUGHTS[i][1]); } else { flipped = flipped.filter(x => x !== i); b.classList.remove('on'); } }); }

/* 5 what to say */
const SAYQ = [
  { q: '你輸了，可以怎麼說？', o: ['恭喜你！', '不公平！', '把牌丟掉'], a: 0, ex: '說「恭喜你」，大家都會想再跟你玩。' },
  { q: '你一直沒拿到分，好想哭，第一步先做什麼？', o: ['用降溫魔法', '大哭跑走', '搶別人的牌'], a: 0, ex: '先讓自己冷靜下來，再繼續玩。' },
  { q: '朋友輸了在哭，你可以怎麼做？', o: ['說「沒關係，我們再玩一次」', '笑他', '不理他'], a: 0, ex: '安慰朋友，大家都會更開心。' },
  { q: '遊戲結束，你贏了，可以怎麼說？', o: ['謝謝大家陪我玩！', '耶！你們都輸了！', '我最厲害！'], a: 0, ex: '贏了不笑別人，說謝謝最有禮貌。' },
];
let sq = { i: 0, picked: null, order: null };
function sSay() {
  const Q = SAYQ[sq.i];
  if (!sq.order) sq.order = Q.o.map((_, i) => i).sort(() => Math.random() - .5);
  const done = sq.picked !== null;
  return `<section class="step">${head(5, '輸了怎麼說', 4)}
    <p class="big">${zh(Q.q)} ${sp(Q.q)}<span class="mins" style="margin-left:8px">${sq.i + 1} / ${SAYQ.length}</span></p>
    <div class="opts">${sq.order.map(k => `<button class="opt ${done ? (k === Q.a ? 'right pop' : k === sq.picked ? 'wrong' : '') : ''}" type="button" data-sq="${k}" ${done ? 'disabled' : ''}>${zh(Q.o[k])}</button>`).join('')}</div>
    ${done ? `<div class="fb ${sq.picked === Q.a ? 'ok' : 'no'} pop"><div>${zh(sq.picked === Q.a ? '答對了！' : '再想想！')}</div><div class="ex">${zh(Q.ex)}</div></div>
      <div class="row" style="justify-content:flex-end"><button class="btn" type="button" id="sqNext">${zh(sq.i < SAYQ.length - 1 ? '下一題' : '再做一次')}</button></div>` : ''}
    <p class="teacher"><b>老師提示</b>：先請學生回想 3D 遊戲裡選到的好做法（深呼吸、換想法、說恭喜你、去幫忙），再做題目。可以請學生兩兩演一次：一人當贏的、一人當輸的，再交換。</p>
  </section>`;
}
function mSay() {
  main.querySelectorAll('[data-sq]').forEach(b => b.onclick = () => { const Q = SAYQ[sq.i]; sq.picked = +b.dataset.sq; render(); say((sq.picked === Q.a ? '答對了！' : '再想想！') + Q.ex); });
  const n = document.getElementById('sqNext'); if (n) n.onclick = () => { sq = { i: (sq.i + 1) % SAYQ.length, picked: null, order: null }; render(); };
}

/* 6 spinner practice */
let names = store.get('names', ['1號', '2號', '3號', '4號', '5號', '6號', '7號']);
let stars = store.get('stars', names.map(() => 0));
let spin = { who: null, result: null, deg: 0, checks: [] };
const LOSE_STEPS = ['用一個降溫魔法', '說一個幫助自己的想法', '跟贏的人說「恭喜你」'];
const WIN_STEPS = ['說「謝謝大家陪我玩」', '不笑別人，邀請大家再玩一局'];
function wheelSVG() {
  const seg = ['贏', '輸', '贏', '輸', '輸', '贏', '輸', '輸'];
  const cols = { '贏': '#6CC08B', '輸': '#F08A5D' };
  let s = '';
  seg.forEach((t, i) => {
    const a0 = (i / seg.length) * 2 * Math.PI - Math.PI / 2, a1 = ((i + 1) / seg.length) * 2 * Math.PI - Math.PI / 2;
    const x0 = 150 + 140 * Math.cos(a0), y0 = 150 + 140 * Math.sin(a0), x1 = 150 + 140 * Math.cos(a1), y1 = 150 + 140 * Math.sin(a1);
    const am = (a0 + a1) / 2;
    s += `<path d="M150 150 L${x0} ${y0} A140 140 0 0 1 ${x1} ${y1} Z" fill="${cols[t]}" stroke="#fff" stroke-width="4"/>`;
    s += `<text x="${150 + 95 * Math.cos(am)}" y="${150 + 95 * Math.sin(am) + 12}" text-anchor="middle" font-size="34" font-weight="900" fill="#fff" font-family="Noto Sans TC, sans-serif">${t}</text>`;
  });
  return `<svg viewBox="0 0 300 300" aria-hidden="true"><g id="wheel" style="transform:rotate(${spin.deg}deg)">${s}</g><circle cx="150" cy="150" r="22" fill="#fff" stroke="#EBE2D3" stroke-width="4"/></svg>`;
}
function sSpin() {
  const steps = spin.result === '輸' ? LOSE_STEPS : WIN_STEPS;
  const allDone = spin.result && spin.checks.length === steps.length;
  return `<section class="step">${head(6, '輸贏練習', 6)}
    <p class="lead">${zh('轉轉盤，看看這次是贏還是輸。不管輸贏，做到好風度就拿星星！')}</p>
    <div class="practice">
      <div style="display:grid;gap:12px">
        <div class="who" role="group" aria-label="選一位同學">${names.map((n, i) => `<button type="button" data-who="${i}" aria-pressed="${spin.who === i}">${esc(n)}</button>`).join('')}</div>
        <div class="wheel-wrap"><span class="pointer" aria-hidden="true"></span>${wheelSVG()}</div>
        <div class="row" style="justify-content:center"><button class="btn peach" type="button" id="spinBtn" ${spin.who === null ? 'disabled' : ''}>${zh(spin.who === null ? '先點一位同學' : '轉轉盤！')}</button></div>
      </div>
      <div style="display:grid;gap:12px;align-content:start">
        ${spin.result ? `<div class="fb ${spin.result === '贏' ? 'ok' : 'info'} pop"><div>${zh(spin.result === '贏' ? esc(names[spin.who]) + '贏了！' : esc(names[spin.who]) + '這次輸了，沒關係！')}</div><div class="ex">${zh(spin.result === '贏' ? '贏的時候，要這樣做：' : '輸的時候，試試看這三件事：')}</div></div>
          <div class="checks">${steps.map((t, i) => `<button class="ck ${spin.checks.includes(i) ? 'on' : ''}" type="button" data-ck="${i}"><span class="box">${spin.checks.includes(i) ? '✓' : ''}</span>${zh(t)}</button>`).join('')}</div>
          ${allDone ? `<div class="fb ok pop"><div>${zh('好風度！拿到一顆星星！')}</div></div>` : ''}` : `<div class="fb info"><div>${zh('點一位同學，再按「轉轉盤」。')}</div><div class="ex">${zh('轉盤上「輸」比較多，因為我們要練習輸的時候怎麼做！')}</div></div>`}
        <h3 style="margin:6px 0 0;font-family:var(--f-head);color:var(--teal)">${zh('好風度星星')}</h3>
        <div class="board">${names.map((n, i) => `<div class="brow"><span class="nm">${esc(n)}</span><span class="st">${stars[i] ? '★'.repeat(Math.min(stars[i], 12)) : ''}</span><b>${stars[i]}</b></div>`).join('')}</div>
        <details><summary>修改學生名字、清除星星</summary>
          <div class="names" style="margin-top:8px">${names.map((n, i) => `<input id="nm${i}" data-nm="${i}" value="${esc(n)}" aria-label="第 ${i + 1} 位學生名字">`).join('')}</div>
          <div class="row" style="margin-top:8px"><button class="pillbtn" type="button" id="clearStars">星星全部歸零</button></div>
        </details>
      </div>
    </div>
    <p class="teacher"><b>老師提示</b>：這個練習讓學生在「低風險」的情況下體驗輸，並馬上練習降溫和好風度。星星只看好風度，不看輸贏。容易難過的學生可以先看別人練一兩輪，再自願上台；做到時具體稱讚，例如「你剛剛很難過，但你有深呼吸，還說恭喜你，好勇敢！」</p>
  </section>`;
}
function mSpin() {
  main.querySelectorAll('[data-who]').forEach(b => b.onclick = () => { spin = { ...spin, who: +b.dataset.who, result: null, checks: [] }; render(); });
  const sb = document.getElementById('spinBtn');
  if (sb) sb.onclick = () => {
    if (spin.who === null) return;
    const seg = ['贏', '輸', '贏', '輸', '輸', '贏', '輸', '輸'];
    const k = Math.floor(Math.random() * seg.length);
    const target = 360 - (k + .5) * (360 / seg.length);
    spin.deg = spin.deg - (spin.deg % 360) + 360 * 5 + target;
    spin.result = null; spin.checks = [];
    const w = document.getElementById('wheel'); w.style.transform = `rotate(${spin.deg}deg)`; sb.disabled = true;
    setTimeout(() => { spin.result = seg[k]; render(); say(spin.result === '贏' ? names[spin.who] + '贏了！' : names[spin.who] + '這次輸了，沒關係！'); }, 3300);
  };
  main.querySelectorAll('[data-ck]').forEach(b => b.onclick = () => {
    const i = +b.dataset.ck; if (spin.checks.includes(i)) return;
    spin.checks.push(i);
    const steps = spin.result === '輸' ? LOSE_STEPS : WIN_STEPS;
    if (spin.checks.length === steps.length) { stars[spin.who]++; store.set('stars', stars); say('好風度！拿到一顆星星！'); }
    render();
  });
  main.querySelectorAll('[data-nm]').forEach(inp => inp.onchange = () => { names[+inp.dataset.nm] = inp.value.trim() || `${+inp.dataset.nm + 1}號`; store.set('names', names); render(); main.querySelector('details').open = true; });
  const cs = document.getElementById('clearStars');
  if (cs) cs.onclick = () => { if (cs.dataset.arm) { stars = names.map(() => 0); store.set('stars', stars); render(); } else { cs.dataset.arm = 1; cs.textContent = '再按一次確定歸零'; } };
}

/* 7 plan card */
let plan = store.get('plan', { tool: null, thought: null });
function sPlan() {
  return `<section class="step">${head(7, '我的冷靜卡', 2)}
    <p class="lead">${zh('下次輸了，我要這樣做：')}</p>
    <div class="plan">
      <h3>${zh('我的冷靜卡')}</h3>
      <div class="prow"><b>${zh('我發現')}</b><div class="big" style="font-size:24px">${zh('心情溫度升高了（想哭、身體熱熱的）')}</div></div>
      <div class="prow"><b>${zh('我會用')}</b><div class="picks">${TOOLS.map(t => `<button type="button" data-pt="${t.id}" aria-pressed="${plan.tool === t.id}">${zh(t.nm)}</button>`).join('')}</div></div>
      <div class="prow"><b>${zh('我跟自己說')}</b><div class="picks">${THOUGHTS.map(([, b], i) => `<button type="button" data-pth="${i}" aria-pressed="${plan.thought === i}">${zh(b)}</button>`).join('')}</div></div>
      <div class="prow"><b>${zh('我會說')}</b><div class="big" style="font-size:24px">${zh('「恭喜你！」「再玩一局！」')}</div></div>
    </div>
    <p class="motto">${zh('輸了也沒關係，跟朋友一起玩最開心！')}</p>
    <p class="teacher"><b>老師提示</b>：每位學生選好後，可以抄在小卡片上，下次玩桌遊前放在桌上提醒自己（事前提醒比事後處理有效）。之後挑選桌遊時，也可以穿插靠運氣、不比速度的遊戲，或讓反應比較慢的學生擔任計分員，增加成功經驗。</p>
  </section>`;
}
function mPlan() {
  main.querySelectorAll('[data-pt]').forEach(b => b.onclick = () => { plan.tool = b.dataset.pt; store.set('plan', plan); render(); });
  main.querySelectorAll('[data-pth]').forEach(b => b.onclick = () => { plan.thought = +b.dataset.pth; store.set('plan', plan); render(); say(THOUGHTS[plan.thought][1]); });
}

/* ---------- shell ---------- */
const MOUNT = { game: mGame, thermo: mThermo, calm: mCalm, think: mThink, say: mSay, spin: mSpin, plan: mPlan };
const chips = document.getElementById('chips');
function render() {
  clearTimers(); g3dStop();
  chips.innerHTML = STEPS.map((s, i) => `<button class="chip" type="button" data-step="${i}" ${i === cur ? 'aria-current="step"' : ''}>${i + 1} ${s.label}</button>`).join('');
  chips.querySelectorAll('[data-step]').forEach(b => b.onclick = () => go(+b.dataset.step));
  const y = window.scrollY;
  main.innerHTML = STEPS[cur].render();
  main.querySelectorAll('[data-say]').forEach(b => b.onclick = () => say(b.dataset.say));
  (MOUNT[STEPS[cur].id] || (() => {}))();
  document.getElementById('prev').innerHTML = zh('上一步');
  document.getElementById('next').innerHTML = zh(cur === STEPS.length - 1 ? '回到開始' : '下一步');
  document.getElementById('prev').disabled = cur === 0;
  window.scrollTo(0, y);
}
function go(i) {
  cur = (i + STEPS.length) % STEPS.length;
  if (location.hash !== '#' + STEPS[cur].id) history.replaceState(null, '', '#' + STEPS[cur].id);
  resetClock(); render();
  document.querySelector('.wrap').scrollIntoView({ block: 'start' });
}
document.getElementById('prev').onclick = () => go(cur - 1);
document.getElementById('next').onclick = () => go(cur + 1);
document.addEventListener('keydown', e => {
  if (e.target.closest('input')) return;
  if (e.key === 'ArrowRight' && cur < STEPS.length - 1) go(cur + 1);
  if (e.key === 'ArrowLeft' && cur > 0) go(cur - 1);
});
window.addEventListener('hashchange', () => { const i = STEPS.findIndex(s => '#' + s.id === location.hash); if (i >= 0 && i !== cur) go(i); });

let left = 0, running = false, tickT = 0;
const clock = document.getElementById('clock'), tgo = document.getElementById('tgo');
function showClock() { const a = Math.abs(left); clock.textContent = `${left < 0 ? '+' : ''}${Math.floor(a / 60)}:${String(a % 60).padStart(2, '0')}`; clock.classList.toggle('over', left < 0); tgo.textContent = running ? '暫停' : '開始'; }
function resetClock() { running = false; clearInterval(tickT); left = STEPS[cur].mins * 60; showClock(); }
tgo.onclick = () => { running = !running; clearInterval(tickT); if (running) tickT = setInterval(() => { left--; showClock(); }, 1000); showClock(); };
document.getElementById('treset').onclick = resetClock;

let zyOn = store.get('zy', true);
const zyBtn = document.getElementById('zyBtn');
const applyZy = () => { document.body.classList.toggle('nozy', !zyOn); zyBtn.textContent = '注音：' + (zyOn ? '開' : '關'); };
zyBtn.onclick = () => { zyOn = !zyOn; store.set('zy', zyOn); applyZy(); };
applyZy();

document.querySelectorAll('[data-zh]').forEach(el => el.innerHTML = zh(el.dataset.zh));
const startAt = STEPS.findIndex(s => '#' + s.id === location.hash);
cur = startAt >= 0 ? startAt : 0;
resetClock(); render();
</script>
